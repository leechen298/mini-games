<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小鸭菜园星球日常</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f4f1e7;
        --panel: #fffdf6;
        --ink: #24352e;
        --muted: #68766f;
        --line: #d8dfcf;
        --green: #39775a;
        --green-light: #dcebd5;
        --yellow: #f2c94c;
        --orange: #e8943f;
        --blue: #5aa6cf;
        --red: #d95d55;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 8% 10%, rgba(255, 255, 255, 0.9), transparent 25%),
          var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      button { font: inherit; }

      .app {
        width: min(100%, 1220px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 14px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 4vw, 38px);
        line-height: 1.05;
      }

      .day-card {
        min-width: 188px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        text-align: center;
        font-weight: 900;
      }

      .layout {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 310px;
        gap: 12px;
      }

      .stage-wrap,
      .side {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 16px 42px rgba(68, 82, 63, 0.12);
        overflow: hidden;
      }

      .stage-wrap { position: relative; min-height: 0; }

      canvas {
        width: 100%;
        height: min(70vh, 670px);
        min-height: 510px;
        display: block;
        outline: none;
        touch-action: none;
      }

      .scene-label {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 7px 11px;
        border-radius: 999px;
        background: rgba(255, 253, 246, 0.92);
        box-shadow: 0 4px 14px rgba(31, 50, 40, 0.14);
        font-size: 13px;
        font-weight: 900;
        pointer-events: none;
      }

      .move-pad {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: grid;
        grid-template-columns: repeat(3, 48px);
        grid-template-rows: repeat(2, 48px);
        gap: 6px;
        z-index: 2;
      }

      .move-key {
        width: 48px;
        height: 48px;
        padding: 0;
        border: 2px solid rgba(255, 255, 255, 0.72);
        border-radius: 11px;
        background: rgba(36, 53, 46, 0.76);
        color: #fff;
        font-size: 22px;
        font-weight: 900;
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }

      .move-key.up { grid-column: 2; }
      .move-key.left { grid-column: 1; grid-row: 2; }
      .move-key.down { grid-column: 2; grid-row: 2; }
      .move-key.right { grid-column: 3; grid-row: 2; }
      .move-key.active { background: var(--orange); transform: translateY(2px); }

      .side {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
      }

      .panel {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel h2 {
        margin: 0 0 10px;
        font-size: 17px;
      }

      .progress {
        height: 12px;
        border-radius: 999px;
        overflow: hidden;
        background: #e5eadf;
      }

      .progress-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), #75a966);
        transition: width 250ms ease;
      }

      .tasks {
        display: grid;
        gap: 8px;
      }

      .task {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 8px;
        align-items: center;
        min-height: 40px;
        padding: 7px 9px;
        border-radius: 9px;
        background: #f2f4eb;
        font-size: 13px;
        font-weight: 800;
      }

      .task.done { background: var(--green-light); }
      .task-icon { font-size: 21px; text-align: center; }
      .task-count { color: var(--muted); font-variant-numeric: tabular-nums; }

      .message {
        margin: 0;
        min-height: 72px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 750;
        line-height: 1.55;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 14px;
      }

      .action {
        min-height: 44px;
        padding: 7px 10px;
        border: 0;
        border-radius: 9px;
        background: var(--green);
        color: #fff;
        font-weight: 900;
        cursor: pointer;
      }

      .action:hover { filter: brightness(1.06); }
      .action:focus-visible { outline: 3px solid #efb13d; outline-offset: 2px; }
      .action.home { background: var(--red); }
      .action.space { background: #315f8a; }
      .action:disabled { cursor: not-allowed; opacity: 0.42; }
      .action.wide { grid-column: 1 / -1; }

      .tips {
        margin: 0;
        padding: 0 3px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.5;
      }

      @media (max-width: 820px) {
        .app { padding: 10px; }
        .layout { grid-template-columns: 1fr; }
        canvas { height: 54vh; min-height: 420px; }
        .side { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; }
        .panel { border-right: 1px solid var(--line); }
        .actions { align-content: center; }
      }

      @media (max-width: 560px) {
        .day-card { width: 100%; }
        canvas { height: 48vh; min-height: 360px; }
        .side { display: block; }
        .panel { border-right: 0; }
        .tasks { grid-template-columns: 1fr 1fr; }
        .task { grid-template-columns: 25px 1fr; }
        .task-count { grid-column: 2; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>小鸭菜园星球日常</h1>
        <div class="day-card"><span id="dayText">第 1 天</span> · <span id="timeText">清晨</span></div>
      </header>

      <section class="layout">
        <div class="stage-wrap">
          <canvas id="game" width="1100" height="680" tabindex="0" aria-label="小鸭菜园星球日常游戏画面"></canvas>
          <div class="scene-label" id="sceneLabel">🥬 阳光菜园</div>
          <div class="move-pad" aria-label="方向控制">
            <button class="move-key up" data-key="ArrowUp" type="button" aria-label="上键：使用无限长手；长按去太空">↑</button>
            <button class="move-key left" data-key="ArrowLeft" type="button" aria-label="向左走">←</button>
            <button class="move-key down" data-key="ArrowDown" type="button" aria-label="下键：回家">↓</button>
            <button class="move-key right" data-key="ArrowRight" type="button" aria-label="向右走">→</button>
          </div>
        </div>

        <aside class="side" aria-label="今日任务">
          <div class="panel">
            <h2>今日进度</h2>
            <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
          </div>
          <div class="panel">
            <div class="tasks">
              <div class="task" id="taskWater"><span class="task-icon">💧</span><span>给菜浇水</span><span class="task-count" id="waterCount">0/3</span></div>
              <div class="task" id="taskHarvest"><span class="task-icon">🥕</span><span>收好蔬菜</span><span class="task-count" id="harvestCount">0/3</span></div>
              <div class="task" id="taskWeed"><span class="task-icon">🌱</span><span>拔掉杂草</span><span class="task-count" id="weedCount">0/3</span></div>
              <div class="task" id="taskSnake"><span class="task-icon">🐍</span><span>送走小蛇</span><span class="task-count" id="snakeCount">0/1</span></div>
              <div class="task" id="taskSpace"><span class="task-icon">🪐</span><span>太阳系巡游</span><span class="task-count" id="spaceCount">0/5</span></div>
            </div>
          </div>
          <div class="panel">
            <h2>小鸭广播</h2>
            <p class="message" id="message" aria-live="polite">早安！用左右方向键走到东西旁边，按一下上键使用无限长手。</p>
          </div>
          <div class="actions">
            <button class="action home" id="homeButton" type="button">🏠 立刻回家</button>
            <button class="action space" id="spaceButton" type="button">🚀 去太阳系</button>
            <button class="action wide" id="nextButton" type="button" hidden>🌞 开始新一天</button>
          </div>
        </aside>
      </section>

      <p class="tips">方向键玩法：← → 控制小鸭走动；靠近物品后短按 ↑ 浇水、收菜、除草或抓蛇；按 ↓ 回家；长按 ↑ 进入太空。也可以用画面右下角的方向按钮。</p>
    </main>

    <script>
      (() => {
        const canvas = document.querySelector('#game');
        const ctx = canvas.getContext('2d');
        const ui = {
          day: document.querySelector('#dayText'),
          time: document.querySelector('#timeText'),
          scene: document.querySelector('#sceneLabel'),
          message: document.querySelector('#message'),
          progress: document.querySelector('#progressFill'),
          home: document.querySelector('#homeButton'),
          space: document.querySelector('#spaceButton'),
          next: document.querySelector('#nextButton')
        };

        const state = {
          day: 1,
          scene: 'garden',
          water: 0,
          harvest: 0,
          weed: 0,
          snake: 0,
          planets: new Set(),
          arm: null,
          particles: [],
          finished: false,
          basket: 0,
          time: 0,
          heldKeys: new Set(),
          upTimer: null
        };

        const gardenTargets = [
          { id: 'water1', type: 'water', x: 265, y: 415, done: false },
          { id: 'water2', type: 'water', x: 470, y: 365, done: false },
          { id: 'water3', type: 'water', x: 690, y: 425, done: false },
          { id: 'crop1', type: 'harvest', x: 355, y: 505, done: false, veggie: '🥕' },
          { id: 'crop2', type: 'harvest', x: 570, y: 475, done: false, veggie: '🥬' },
          { id: 'crop3', type: 'harvest', x: 795, y: 515, done: false, veggie: '🍅' },
          { id: 'weed1', type: 'weed', x: 285, y: 575, done: false },
          { id: 'weed2', type: 'weed', x: 500, y: 565, done: false },
          { id: 'weed3', type: 'weed', x: 730, y: 585, done: false },
          { id: 'mailbox', type: 'fun', x: 970, y: 385, done: false, name: '信箱' },
          { id: 'cloud', type: 'fun', x: 630, y: 120, done: false, name: '软绵绵的云' }
        ];

        const planets = [
          { id: 'mercury', name: '水星', x: 230, y: 345, r: 20, color: '#9a9187' },
          { id: 'venus', name: '金星', x: 350, y: 235, r: 34, color: '#d99a47' },
          { id: 'earth', name: '地球', x: 500, y: 420, r: 38, color: '#4e9ed1' },
          { id: 'mars', name: '火星', x: 670, y: 270, r: 29, color: '#c75d42' },
          { id: 'saturn', name: '土星', x: 865, y: 415, r: 54, color: '#d7b56c' }
        ];

        const duck = { x: 120, y: 490 };

        function roundedRect(x, y, w, h, r, fill) {
          ctx.beginPath();
          ctx.roundRect(x, y, w, h, r);
          ctx.fillStyle = fill;
          ctx.fill();
        }

        function text(value, x, y, size, color = '#24352e', align = 'left', weight = 800) {
          ctx.fillStyle = color;
          ctx.textAlign = align;
          ctx.textBaseline = 'middle';
          ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
          ctx.fillText(value, x, y);
        }

        function drawDuck(x, y, scale = 1, helmet = false) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#f3c947';
          ctx.beginPath(); ctx.ellipse(0, 20, 42, 48, -0.12, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(4, -26, 35, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#e98b34';
          ctx.beginPath(); ctx.moveTo(31, -23); ctx.lineTo(64, -13); ctx.lineTo(31, -7); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14, -35, 9, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#24352e'; ctx.beginPath(); ctx.arc(17, -35, 4, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#c8922b'; ctx.lineWidth = 6; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-15, 63); ctx.lineTo(-18, 77); ctx.moveTo(20, 62); ctx.lineTo(23, 77); ctx.stroke();
          if (helmet) {
            ctx.strokeStyle = 'rgba(197, 234, 248, 0.85)'; ctx.lineWidth = 9;
            ctx.beginPath(); ctx.arc(4, -25, 47, Math.PI * 0.78, Math.PI * 2.22); ctx.stroke();
            ctx.fillStyle = '#315f8a'; roundedRect(-31, 7, 64, 45, 13, '#315f8a');
            text('星', 1, 30, 19, '#fff', 'center', 900);
          }
          ctx.restore();
        }

        function drawGarden() {
          const sky = ctx.createLinearGradient(0, 0, 0, 470);
          sky.addColorStop(0, '#8fd2ef'); sky.addColorStop(1, '#d9f1d0');
          ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f4cf56'; ctx.beginPath(); ctx.arc(930, 105, 55, 0, Math.PI * 2); ctx.fill();
          drawCloud(205, 120, 1); drawCloud(620, 120, 0.8);
          ctx.fillStyle = '#71a95a'; ctx.beginPath(); ctx.moveTo(0, 370); ctx.quadraticCurveTo(220, 250, 430, 370); ctx.quadraticCurveTo(700, 250, 1100, 370); ctx.lineTo(1100, 680); ctx.lineTo(0, 680); ctx.closePath(); ctx.fill();
          drawHouse(35, 245);
          ctx.fillStyle = '#9a6c45'; ctx.beginPath(); ctx.moveTo(180, 400); ctx.lineTo(860, 365); ctx.lineTo(930, 650); ctx.lineTo(175, 650); ctx.closePath(); ctx.fill();
          for (let i = 0; i < 5; i += 1) {
            ctx.strokeStyle = '#744a30'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(205, 435 + i * 44); ctx.lineTo(890, 405 + i * 48); ctx.stroke();
          }
          gardenTargets.forEach(drawGardenTarget);
          if (completedChores() >= 4 && !state.snake) drawSnake(890, 545);
          drawBasket();
          drawDuck(duck.x, duck.y);
          drawNearbyHint();
        }

        function drawCloud(x, y, scale) {
          ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); ctx.fillStyle = 'rgba(255,255,255,.9)';
          ctx.beginPath(); ctx.arc(-35, 5, 30, 0, Math.PI * 2); ctx.arc(0, -8, 40, 0, Math.PI * 2); ctx.arc(40, 5, 27, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }

        function drawHouse(x, y) {
          ctx.fillStyle = '#f4e2b5'; ctx.fillRect(x, y + 65, 150, 150);
          ctx.fillStyle = '#c75d42'; ctx.beginPath(); ctx.moveTo(x - 14, y + 70); ctx.lineTo(x + 75, y); ctx.lineTo(x + 164, y + 70); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#7e5137'; ctx.fillRect(x + 90, y + 125, 43, 90);
          ctx.fillStyle = '#8cc4da'; ctx.fillRect(x + 22, y + 105, 48, 42);
          text('小鸭家', x + 75, y + 235, 16, '#fff', 'center', 900);
        }

        function drawGardenTarget(target) {
          if (target.done && target.type !== 'fun') return;
          if (target.type === 'water') {
            ctx.fillStyle = '#5ba8db'; ctx.beginPath(); ctx.moveTo(target.x, target.y - 26); ctx.quadraticCurveTo(target.x - 22, target.y + 4, target.x, target.y + 18); ctx.quadraticCurveTo(target.x + 22, target.y + 4, target.x, target.y - 26); ctx.fill();
          } else if (target.type === 'harvest') {
            text(target.veggie, target.x, target.y, 44, '#fff', 'center');
          } else if (target.type === 'weed') {
            ctx.strokeStyle = '#3c7a42'; ctx.lineWidth = 7; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(target.x, target.y + 15); ctx.lineTo(target.x, target.y - 19); ctx.moveTo(target.x, target.y - 4); ctx.lineTo(target.x - 15, target.y - 16); ctx.moveTo(target.x, target.y - 9); ctx.lineTo(target.x + 17, target.y - 25); ctx.stroke();
          } else if (target.id === 'mailbox') {
            ctx.fillStyle = '#d85b50'; ctx.fillRect(target.x - 24, target.y - 24, 48, 42); ctx.fillStyle = '#7b5236'; ctx.fillRect(target.x - 4, target.y + 18, 8, 65);
          }
        }

        function drawSnake(x, y) {
          ctx.strokeStyle = '#568348'; ctx.lineWidth = 17; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(x - 36, y + 20); ctx.bezierCurveTo(x - 8, y - 22, x + 18, y + 45, x + 43, y - 2); ctx.stroke();
          ctx.fillStyle = '#76a65e'; ctx.beginPath(); ctx.arc(x + 45, y - 8, 17, 0, Math.PI * 2); ctx.fill();
          text('· ·', x + 45, y - 12, 15, '#17251e', 'center', 900);
          text('点我送去宇宙', x, y + 50, 14, '#fff', 'center', 900);
        }

        function drawBasket() {
          roundedRect(70, 585, 105, 58, 14, '#bb7b3e');
          ctx.strokeStyle = '#7d4b28'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(122, 590, 40, Math.PI, Math.PI * 2); ctx.stroke();
          text(`菜篮 ${state.basket}`, 122, 618, 15, '#fff', 'center', 900);
        }

        function drawHome() {
          ctx.fillStyle = '#f4dfb5'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#d8b37a'; ctx.fillRect(0, 490, canvas.width, 190);
          ctx.fillStyle = '#9fc8df'; ctx.fillRect(650, 85, 280, 205); ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.strokeRect(650, 85, 280, 205);
          ctx.fillStyle = '#76b666'; ctx.fillRect(0, 275, canvas.width, 215);
          drawHouse(95, 190); drawDuck(520, 430, 1.35);
          roundedRect(650, 345, 330, 130, 20, 'rgba(255,253,246,.92)');
          text('安全到家啦！', 815, 385, 28, '#24352e', 'center', 900);
          text('休息一下，再回菜园继续。', 815, 430, 18, '#68766f', 'center', 750);
        }

        function drawSpace() {
          const sky = ctx.createRadialGradient(550, 340, 40, 550, 340, 650);
          sky.addColorStop(0, '#203a67'); sky.addColorStop(1, '#070d22'); ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < 90; i += 1) {
            const x = (i * 79 + 31) % 1100; const y = (i * 47 + 13) % 680; const r = i % 8 === 0 ? 2 : 1;
            ctx.fillStyle = i % 5 ? '#fff' : '#efcf67'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
          }
          ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2;
          [115, 225, 345].forEach(r => { ctx.beginPath(); ctx.ellipse(540, 345, r * 1.35, r * .62, -.08, 0, Math.PI * 2); ctx.stroke(); });
          ctx.fillStyle = '#f2c657'; ctx.beginPath(); ctx.arc(85, 345, 73, 0, Math.PI * 2); ctx.fill();
          planets.forEach(drawPlanet);
          drawDuck(duck.x, 565, 0.92, true);
          drawNearbyHint();
          text('点亮 5 个星球巡游点', 550, 65, 24, '#fff', 'center', 900);
        }

        function drawPlanet(planet) {
          const visited = state.planets.has(planet.id);
          ctx.save(); ctx.translate(planet.x, planet.y);
          if (planet.id === 'saturn') {
            ctx.strokeStyle = '#ecd79d'; ctx.lineWidth = 13; ctx.beginPath(); ctx.ellipse(0, 0, 82, 25, -.18, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.fillStyle = planet.color; ctx.beginPath(); ctx.arc(0, 0, planet.r, 0, Math.PI * 2); ctx.fill();
          if (planet.id === 'earth') { ctx.fillStyle = '#79a85f'; ctx.beginPath(); ctx.ellipse(-10, -7, 14, 22, .6, 0, Math.PI * 2); ctx.fill(); }
          if (visited) { ctx.strokeStyle = '#85ef9a'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 0, planet.r + 10, 0, Math.PI * 2); ctx.stroke(); text('✓', 0, 1, 28, '#fff', 'center', 900); }
          text(planet.name, 0, planet.r + 28, 16, '#fff', 'center', 800); ctx.restore();
        }

        function drawArm() {
          if (!state.arm) return;
          const { fromX, fromY, toX, toY, progress, label } = state.arm;
          const t = progress < .7 ? progress / .7 : 1 - (progress - .7) / .3;
          const reach = Math.max(0, Math.min(1, t));
          const hx = fromX + (toX - fromX) * reach; const hy = fromY + (toY - fromY) * reach;
          ctx.strokeStyle = '#f3c947'; ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.quadraticCurveTo((fromX + hx) / 2, Math.min(fromY, hy) - 28, hx, hy); ctx.stroke();
          ctx.fillStyle = '#f3c947'; ctx.beginPath(); ctx.arc(hx, hy, 16, 0, Math.PI * 2); ctx.fill();
          if (progress > .38 && progress < .85) { roundedRect(hx - 54, hy - 54, 108, 28, 14, 'rgba(255,253,246,.94)'); text(label, hx, hy - 40, 13, '#24352e', 'center', 900); }
        }

        function addParticles(x, y, color) {
          for (let i = 0; i < 14; i += 1) state.particles.push({ x, y, vx: Math.cos(i) * (1 + i % 4), vy: Math.sin(i * 2.3) * 3 - 1, life: 1, color });
        }

        function drawParticles() {
          state.particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; });
        }

        function nearbyTarget() {
          if (state.scene === 'garden') {
            const choices = gardenTargets.filter(item => !item.done && item.type !== 'fun');
            if (completedChores() >= 4 && !state.snake) choices.push({ id: 'snake', type: 'snake', x: 890, y: 545 });
            return choices.sort((a, b) => Math.abs(a.x - duck.x) - Math.abs(b.x - duck.x))[0] || null;
          }
          if (state.scene === 'space') return [...planets].sort((a, b) => Math.abs(a.x - duck.x) - Math.abs(b.x - duck.x))[0] || null;
          return null;
        }

        function drawNearbyHint() {
          const target = nearbyTarget();
          if (!target || Math.abs(target.x - duck.x) > 105) return;
          const labels = { water: '↑ 浇水', harvest: '↑ 收菜', weed: '↑ 除草', snake: '↑ 抓蛇' };
          const label = state.scene === 'space' ? `↑ 巡游${target.name}` : labels[target.type];
          roundedRect(duck.x - 58, state.scene === 'space' ? 455 : 375, 116, 34, 17, 'rgba(255,253,246,.94)');
          text(label, duck.x, state.scene === 'space' ? 472 : 392, 14, '#24352e', 'center', 900);
        }

        function startArm(x, y, label, onGrab) {
          if (state.arm) return;
          const origin = state.scene === 'space' ? { x: duck.x + 18, y: 555 } : { x: duck.x + 18, y: duck.y + 5 };
          state.arm = { fromX: origin.x, fromY: origin.y, toX: x, toY: y, progress: 0, label, onGrab, grabbed: false };
        }

        function handleGardenClick(x, y) {
          if (completedChores() >= 4 && !state.snake && Math.hypot(x - 890, y - 545) < 80) {
            startArm(890, 545, '抓住小蛇', () => {
              state.snake = 1; addParticles(890, 545, '#85c66b'); setMessage('呼——小鸭把小蛇轻轻一抛，送到遥远的太空小岛啦！'); updateUi();
            }); return;
          }
          const target = gardenTargets.find(item => !item.done && Math.hypot(x - item.x, y - item.y) < (item.type === 'fun' ? 70 : 55));
          if (!target) { startArm(x, y, '什么都抓得到', () => { addParticles(x, y, '#fff'); setMessage('无限长手嗖地伸过去，连这么远的地方也够得到！'); }); return; }
          const labels = { water: '浇水', harvest: '收进菜篮', weed: '拔掉杂草', fun: `摸摸${target.name}` };
          startArm(target.x, target.y, labels[target.type], () => finishGardenTarget(target));
        }

        function finishGardenTarget(target) {
          if (target.type === 'fun') { setMessage(`抓到${target.name}啦！不过小鸭又把它放回了原处。`); addParticles(target.x, target.y, '#fff'); return; }
          target.done = true; state[target.type] += 1;
          if (target.type === 'harvest') state.basket += 1;
          const messages = { water: '土地咕嘟咕嘟喝饱水啦！', harvest: '新鲜蔬菜稳稳放进菜篮。', weed: '杂草拔掉，菜苗可以舒服地长大。' };
          setMessage(messages[target.type]); addParticles(target.x, target.y, target.type === 'water' ? '#6fc3e8' : '#f3d160');
          if (completedChores() === 4 && !state.snake) {
            setMessage('草丛里有一条迷路的小蛇！点它，用无限长手送它去太空。');
          }
          updateUi();
        }

        function completedChores() { return state.water + state.harvest + state.weed; }
        function handleSpaceClick(x, y) {
          const planet = planets.find(item => Math.hypot(x - item.x, y - item.y) < item.r + 28);
          if (!planet) { startArm(x, y, '抓到星光', () => { addParticles(x, y, '#f5dc76'); setMessage('小鸭从银河里抓回一小把闪亮星光。'); }); return; }
          startArm(planet.x, planet.y, `到达${planet.name}`, () => {
            if (!state.planets.has(planet.id)) { state.planets.add(planet.id); addParticles(planet.x, planet.y, '#8cf0a0'); setMessage(`巡游到${planet.name}！无限长手在这里也一样好用。`); }
            if (state.planets.size === planets.length) { state.finished = true; ui.next.hidden = false; setMessage('五个星球都打卡啦！小鸭绕完太阳系，今天的日常圆满完成！'); }
            updateUi();
          });
        }

        function goHome() {
          state.arm = null;
          if (state.scene === 'home') {
            state.scene = 'garden'; setMessage('休息好啦，回菜园继续今天的任务。');
          } else {
            state.scene = 'home'; setMessage('小鸭按一下下键，马上回到温暖的家啦！');
          }
          updateUi();
        }

        function enterHome() {
          if (state.scene === 'home') return;
          state.scene = 'home'; state.arm = null;
          setMessage('小鸭按一下下键，马上回到温暖的家啦！');
          updateUi();
        }

        function goSpace() {
          state.scene = 'space'; state.arm = null;
          setMessage('长按上键出发成功！用左右键走动，靠近星球后短按上键巡游。');
          updateUi();
        }

        function newDay() {
          state.day += 1; state.scene = 'garden'; state.water = 0; state.harvest = 0; state.weed = 0; state.snake = 0; state.planets.clear(); state.finished = false; state.basket = 0; state.arm = null; state.particles = []; duck.x = 120;
          gardenTargets.forEach(target => { if (target.type !== 'fun') target.done = false; });
          ui.next.hidden = true; setMessage('新的一天开始啦！菜园又长出了新鲜蔬菜。'); updateUi();
        }

        function setMessage(value) { ui.message.textContent = value; }

        function updateUi() {
          const total = state.water + state.harvest + state.weed + state.snake + state.planets.size;
          ui.day.textContent = `第 ${state.day} 天`;
          ui.time.textContent = state.scene === 'space' ? '星空巡游' : state.finished ? '晚安' : completedChores() > 4 ? '下午' : '清晨';
          ui.scene.textContent = state.scene === 'garden' ? '🥬 阳光菜园' : state.scene === 'home' ? '🏠 温暖小家' : '🪐 太阳系';
          document.querySelector('#waterCount').textContent = `${state.water}/3`;
          document.querySelector('#harvestCount').textContent = `${state.harvest}/3`;
          document.querySelector('#weedCount').textContent = `${state.weed}/3`;
          document.querySelector('#snakeCount').textContent = `${state.snake}/1`;
          document.querySelector('#spaceCount').textContent = `${state.planets.size}/5`;
          [['taskWater', state.water === 3], ['taskHarvest', state.harvest === 3], ['taskWeed', state.weed === 3], ['taskSnake', state.snake === 1], ['taskSpace', state.planets.size === 5]].forEach(([id, done]) => document.querySelector(`#${id}`).classList.toggle('done', done));
          ui.progress.style.width = `${Math.round(total / 15 * 100)}%`;
          ui.space.textContent = state.scene === 'space' ? '🪐 正在巡游' : '🚀 去太阳系';
          ui.home.textContent = state.scene === 'home' ? '🥬 回到菜园' : '🏠 立刻回家';
        }

        function pointerPosition(event) {
          const rect = canvas.getBoundingClientRect(); return { x: (event.clientX - rect.left) * canvas.width / rect.width, y: (event.clientY - rect.top) * canvas.height / rect.height };
        }

        canvas.addEventListener('pointerdown', event => {
          const { x, y } = pointerPosition(event);
          if (state.scene === 'garden') handleGardenClick(x, y);
          else if (state.scene === 'space') handleSpaceClick(x, y);
          else { state.scene = 'garden'; setMessage('回菜园继续忙活吧！'); updateUi(); }
          canvas.focus();
        });

        function useUpAction() {
          if (state.arm) return;
          if (state.scene === 'home') {
            state.scene = 'garden'; setMessage('小鸭走出家门，回到菜园啦！'); updateUi(); return;
          }
          const target = nearbyTarget();
          if (!target || Math.abs(target.x - duck.x) > 105) {
            setMessage(state.scene === 'space' ? '先用左右键靠近一个星球，再短按上键。' : '先用左右键走到水滴、蔬菜、杂草或小蛇旁边。');
            return;
          }
          if (state.scene === 'space') handleSpaceClick(target.x, target.y);
          else handleGardenClick(target.x, target.y);
        }

        function pressDirection(key) {
          if (key === 'ArrowLeft' || key === 'ArrowRight') state.heldKeys.add(key);
          if (key === 'ArrowDown') enterHome();
          if (key === 'ArrowUp' && !state.upTimer) {
            state.upTimer = window.setTimeout(() => {
              state.upTimer = null;
              goSpace();
            }, 650);
          }
          document.querySelector(`[data-key="${key}"]`)?.classList.add('active');
        }

        function releaseDirection(key) {
          state.heldKeys.delete(key);
          if (key === 'ArrowUp') {
            if (state.upTimer) {
              clearTimeout(state.upTimer);
              state.upTimer = null;
              useUpAction();
            }
          }
          document.querySelector(`[data-key="${key}"]`)?.classList.remove('active');
        }

        window.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
          event.preventDefault();
          if (!event.repeat) pressDirection(event.key);
        });

        window.addEventListener('keyup', event => {
          if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
          event.preventDefault(); releaseDirection(event.key);
        });

        window.addEventListener('blur', () => {
          state.heldKeys.clear();
          if (state.upTimer) clearTimeout(state.upTimer);
          state.upTimer = null;
          document.querySelectorAll('.move-key').forEach(button => button.classList.remove('active'));
        });

        document.querySelectorAll('.move-key').forEach(button => {
          const key = button.dataset.key;
          button.addEventListener('pointerdown', event => { event.preventDefault(); button.setPointerCapture(event.pointerId); pressDirection(key); });
          button.addEventListener('pointerup', event => { event.preventDefault(); releaseDirection(key); });
          button.addEventListener('pointercancel', () => releaseDirection(key));
        });

        ui.home.addEventListener('click', goHome);
        ui.space.addEventListener('click', goSpace);
        ui.next.addEventListener('click', newDay);

        function tick() {
          state.time += 1;
          if (state.scene !== 'home' && !state.arm) {
            if (state.heldKeys.has('ArrowLeft')) duck.x -= 6;
            if (state.heldKeys.has('ArrowRight')) duck.x += 6;
            duck.x = Math.max(90, Math.min(1010, duck.x));
          }
          if (state.arm) {
            state.arm.progress += .045;
            if (state.arm.progress >= .67 && !state.arm.grabbed) { state.arm.grabbed = true; state.arm.onGrab(); }
            if (state.arm.progress >= 1) state.arm = null;
          }
          state.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .08; p.life -= .025; });
          state.particles = state.particles.filter(p => p.life > 0);
          if (state.scene === 'garden') drawGarden(); else if (state.scene === 'home') drawHome(); else drawSpace();
          drawArm(); drawParticles(); requestAnimationFrame(tick);
        }

        updateUi(); tick();
      })();
    </script>
  </body>
</html>
