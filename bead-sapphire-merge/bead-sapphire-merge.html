<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>滚滚宝石合成</title>
    <style>
      :root {
        color-scheme: light;
        --sky: #eaf8ff;
        --panel: rgba(255, 255, 255, 0.92);
        --ink: #173451;
        --muted: #60758a;
        --line: #c8dfec;
        --blue: #368cf4;
        --green: #45bc78;
        --red: #ef5b63;
        --sapphire: #205dda;
        --ruby: #d92755;
        --emerald: #07986a;
        --gold: #f3b936;
        --shadow: rgba(37, 86, 118, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 12% 10%, rgba(255,255,255,.95) 0 5%, transparent 18%),
          radial-gradient(circle at 88% 18%, #d5f3ff 0 8%, transparent 24%),
          linear-gradient(180deg, var(--sky), #f9fcff 70%, #e4f7ea);
      }

      button { font: inherit; }

      .app {
        width: min(1180px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 14px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 4vw, 40px);
        line-height: 1.08;
      }

      .goal {
        min-width: 138px;
        padding: 9px 13px;
        border: 2px solid #78d4ad;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 8px 20px var(--shadow);
        text-align: center;
        font-weight: 900;
        white-space: nowrap;
      }

      .layout {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 12px;
      }

      .game-card,
      .side {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 18px 45px var(--shadow);
      }

      .game-card {
        min-width: 0;
        padding: 14px;
        display: grid;
        grid-template-rows: auto auto;
        align-content: start;
        gap: 10px;
      }

      .box-wrap {
        position: relative;
        min-height: 0;
      }

      canvas {
        width: 100%;
        height: min(70vh, 680px);
        min-height: 500px;
        display: block;
        border: 10px solid #70a8c3;
        border-top-color: #9bcbe0;
        border-radius: 26px;
        background: #d9f1fa;
        box-shadow:
          inset 0 0 0 3px rgba(255,255,255,.75),
          inset 0 -18px 28px rgba(54, 121, 151, .15),
          0 8px 18px rgba(47, 99, 126, .16);
        outline: none;
        touch-action: none;
      }

      canvas:focus-visible { border-color: var(--gold); }

      .box-label {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 10px;
        transform: translateX(-50%);
        padding: 5px 18px 7px;
        border-radius: 0 0 14px 14px;
        background: #70a8c3;
        color: #fff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: .12em;
        pointer-events: none;
      }

      .message {
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 9px 14px;
        border-radius: 15px;
        background: #edf8e9;
        color: #32643d;
        font-weight: 850;
        text-align: center;
      }

      .side {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .side h2 { margin: 0 0 8px; font-size: 19px; }
      .side p { margin: 0; color: var(--muted); line-height: 1.55; font-weight: 700; }

      .next-card {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 12px;
        min-height: 76px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #f6fbfe;
      }

      .next-ball {
        width: 52px;
        height: 52px;
        border: 3px solid rgba(255,255,255,.8);
        border-radius: 50%;
        background: var(--blue);
        box-shadow: inset -9px -10px 12px rgba(0,0,0,.17), 0 5px 8px rgba(30,75,105,.2);
      }

      .next-card span { display: block; color: var(--muted); font-size: 12px; font-weight: 800; }
      .next-card strong { display: block; margin-top: 3px; font-size: 21px; }

      .chain {
        display: grid;
        gap: 6px;
      }

      .chain-step {
        display: grid;
        grid-template-columns: 34px 1fr 34px;
        align-items: center;
        min-height: 42px;
        padding: 5px 9px;
        border-radius: 12px;
        background: #f2f8fb;
        font-size: 13px;
        font-weight: 850;
      }

      .token {
        justify-self: center;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        box-shadow: inset -4px -5px 6px rgba(0,0,0,.18);
      }

      .token.blue { background: var(--blue); }
      .token.green { background: var(--green); }
      .token.red { background: var(--red); }
      .token.gem { border-radius: 5px 50% 50%; transform: rotate(45deg); }
      .token.sapphire { background: linear-gradient(135deg, #70d2ff, var(--sapphire) 62%); }
      .token.ruby { background: linear-gradient(135deg, #ff7590, var(--ruby) 62%); }
      .token.emerald { background: linear-gradient(135deg, #6ff1bd, var(--emerald) 62%); }
      .token.ice { background: linear-gradient(135deg, #f5ffff, #76dff5 55%, #268fc9); }
      .token.bomb { border: 3px solid #4a5664; background: radial-gradient(circle at 35% 28%, #718092, #19222c 68%); }
      .token.bottle {
        border: 2px solid #3d8fc6;
        border-radius: 7px 7px 12px 12px;
        background: radial-gradient(circle at 50% 65%, #ef5b63 0 18%, transparent 20%), #f4fdff;
      }
      .token.earth { border: 2px solid #fff; background: radial-gradient(ellipse at 35% 38%, #4fbd70 0 20%, transparent 22%), #2e91dd; }
      .token.sun { background: radial-gradient(circle, #fff4a0, #f8b42c 62%, #ee7624); box-shadow: 0 0 8px #f8b42c; }
      .token.uranus { background: #7ce0e4; box-shadow: inset -4px -5px 6px rgba(0,0,0,.12), 0 0 0 3px #b8f4f5; }
      .token.solar { background: radial-gradient(circle, #ffd44d 0 16%, #29396f 18% 100%); border: 2px solid #8ea7ff; }
      .token.black { background: #080b12; box-shadow: 0 0 9px #7656d9; }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .stat {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        font-weight: 800;
      }

      .stat strong { display: block; margin-top: 3px; color: var(--ink); font-size: 21px; }

      .actions {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .action {
        min-height: 46px;
        border: 0;
        border-radius: 14px;
        background: #e5f0f6;
        color: var(--ink);
        font-weight: 900;
        cursor: pointer;
      }

      .action.primary { background: var(--emerald); color: #fff; }

      .win {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(15, 42, 70, .45);
        backdrop-filter: blur(5px);
      }

      .win[hidden] { display: none; }

      .win-card {
        width: min(430px, 100%);
        padding: 28px;
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 24px 80px rgba(15,42,70,.35);
        text-align: center;
      }

      .big-gem { font-size: 78px; filter: drop-shadow(0 9px 8px rgba(0,135,92,.28)); }
      .win-card h2 { margin: 4px 0 8px; font-size: 30px; }
      .win-card p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; font-weight: 750; }

      @media (max-width: 800px) {
        .app { padding: 9px; }
        .layout { grid-template-columns: 1fr; }
        .game-card { padding: 8px; }
        canvas { height: 61vh; min-height: 470px; border-width: 7px; }
        .side { padding: 13px; }
        .chain { grid-template-columns: 1fr; }
        .topbar { align-items: flex-start; }
        .goal { min-width: 120px; padding-inline: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 id="gameTitle">滚滚宝石合成</h1>
        <div class="goal"><span id="goalEmoji">🏺</span> <span id="goalLabel">纪念瓷瓶</span> <span id="goalCount">0</span><span id="goalTotal">/1</span></div>
      </header>

      <section class="layout">
        <article class="game-card">
          <div class="box-wrap">
            <div id="boxLabel" class="box-label">滚 动 大 框</div>
            <canvas id="gameCanvas" tabindex="0" aria-label="宝石滚动合成大框"></canvas>
          </div>
          <div id="message" class="message" aria-live="polite">按左右方向键调位置，按下方向键放下珠子！</div>
        </article>

        <aside class="side">
          <section>
            <h2>下一颗</h2>
            <div class="next-card">
              <i id="nextBall" class="next-ball"></i>
              <div><span>随机出现</span><strong id="nextName">蓝珠</strong></div>
            </div>
          </section>

          <section>
            <h2>合成顺序</h2>
            <div class="chain">
              <div class="chain-step"><i class="token blue"></i><span>两颗蓝珠</span><i class="token green"></i></div>
              <div class="chain-step"><i class="token green"></i><span>两颗绿珠</span><i class="token red"></i></div>
              <div class="chain-step"><i class="token red"></i><span>两颗红珠</span><i class="token gem sapphire"></i></div>
              <div class="chain-step"><i class="token gem sapphire"></i><span>两颗蓝宝石</span><i class="token gem ruby"></i></div>
              <div class="chain-step"><i class="token gem ruby"></i><span>两颗红宝石</span><i class="token gem emerald"></i></div>
              <div class="chain-step"><i class="token gem emerald"></i><span>两颗绿宝石</span><i class="token gem ice"></i></div>
              <div class="chain-step"><i class="token gem ice"></i><span>第一遍两颗冰宝石</span><i class="token bomb"></i></div>
              <div class="chain-step"><i class="token gem ice"></i><span>第二遍两颗冰宝石</span><i class="token bottle"></i></div>
              <div class="chain-step"><i class="token bottle"></i><span>瓷瓶分裂</span><i class="token earth"></i></div>
              <div class="chain-step"><i class="token earth"></i><span>两颗地球</span><i class="token sun"></i></div>
              <div class="chain-step"><i class="token sun"></i><span>太阳分裂</span><i class="token uranus"></i></div>
              <div class="chain-step"><i class="token uranus"></i><span>两颗天王星</span><i class="token solar"></i></div>
              <div class="chain-step"><i class="token solar"></i><span>太阳系爆出</span><i class="token black"></i></div>
            </div>
          </section>

          <section>
            <div class="stats">
              <div class="stat">第几遍<strong id="roundNumber">1</strong></div>
              <div class="stat">还没落下<strong id="queueCount">60</strong></div>
              <div class="stat">框内物品<strong id="ballCount">0</strong></div>
            </div>
          </section>

          <section>
            <h2>怎么玩</h2>
            <p>合成时，左右键移动落点，下键落珠。进入地球后，用方向键转动地球并点击黑珠。进入黑珠内部后，左右键移动，空格键跳跃。全程没有倒计时。</p>
          </section>

          <div class="actions">
            <button id="shakeButton" class="action" type="button">↔ 晃一晃</button>
            <button id="restartButton" class="action primary" type="button">重新开始</button>
          </div>
        </aside>
      </section>
    </main>

    <div id="win" class="win" hidden>
      <div class="win-card">
        <div class="big-gem">🧒 ✨</div>
        <h2>丢失的物品全找回啦！</h2>
        <p>黑色珠子变成的小人找回了所有珠子和宝石，宇宙寻物任务完成！</p>
        <button id="againButton" class="action primary" type="button">再玩一次</button>
      </div>
    </div>

    <script>
      const TYPE_INFO = {
        blue: { name: "蓝珠", color: "#368cf4", next: "green", radius: 22, gem: false },
        green: { name: "绿珠", color: "#45bc78", next: "red", radius: 23, gem: false },
        red: { name: "红珠", color: "#ef5b63", next: "sapphire", radius: 24, gem: false },
        sapphire: { name: "蓝宝石", color: "#205dda", next: "ruby", radius: 26, gem: true },
        ruby: { name: "红宝石", color: "#d92755", next: "emerald", radius: 28, gem: true },
        emerald: { name: "绿宝石", color: "#07986a", next: "ice", radius: 30, gem: true },
        ice: { name: "冰宝石", color: "#76dff5", next: null, radius: 31, gem: true },
        bomb: { name: "炸弹", color: "#202b36", next: null, radius: 35, gem: false },
        bottle: { name: "纪念瓷瓶", color: "#eafaff", next: null, radius: 34, gem: false },
        earth: { name: "地球", color: "#2e91dd", next: "sun", radius: 36, gem: false },
        sun: { name: "太阳", color: "#f8b42c", next: null, radius: 39, gem: false },
        uranus: { name: "天王星", color: "#7ce0e4", next: "solar", radius: 35, gem: false },
        solar: { name: "太阳系", color: "#29396f", next: null, radius: 43, gem: false },
        black: { name: "黑色珠子", color: "#080b12", next: null, radius: 35, gem: false }
      };

      const START_TYPES = ["blue", "green", "red"];
      const canvas = document.querySelector("#gameCanvas");
      const context = canvas.getContext("2d");
      const messageElement = document.querySelector("#message");
      const nextBallElement = document.querySelector("#nextBall");
      const nextNameElement = document.querySelector("#nextName");
      const queueCountElement = document.querySelector("#queueCount");
      const ballCountElement = document.querySelector("#ballCount");
      const gameTitleElement = document.querySelector("#gameTitle");
      const boxLabelElement = document.querySelector("#boxLabel");
      const goalEmojiElement = document.querySelector("#goalEmoji");
      const goalLabelElement = document.querySelector("#goalLabel");
      const goalCountElement = document.querySelector("#goalCount");
      const goalTotalElement = document.querySelector("#goalTotal");
      const roundNumberElement = document.querySelector("#roundNumber");
      const winElement = document.querySelector("#win");
      const shakeButton = document.querySelector("#shakeButton");

      let width = 700;
      let height = 620;
      let queue = [];
      let balls = [];
      let dropX = width / 2;
      let lastTime = 0;
      let horizontalPush = 0;
      let won = false;
      let round = 1;
      let idCounter = 0;
      let mergeFlash = [];
      let sparks = [];
      let gameMode = "merge";
      let hero = null;
      let lostItems = [];
      let foundCount = 0;
      let hintGlow = 0;
      let globeAngle = 0;
      let globeTilt = 0;
      let blackSpot = { x: 0, y: 0, visible: false, radius: 18 };
      let worldWidth = 2400;
      let cameraX = 0;
      let platforms = [];
      const pressedKeys = new Set();

      function shuffledQueue() {
        const items = START_TYPES.flatMap(type => Array(20).fill(type));
        for (let index = items.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [items[index], items[randomIndex]] = [items[randomIndex], items[index]];
        }
        return items;
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const oldWidth = width;
        const oldHeight = height;
        width = Math.max(280, rect.width);
        height = Math.max(420, rect.height);
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);

        if (oldWidth && oldHeight && balls.length) {
          const scaleX = width / oldWidth;
          const scaleY = height / oldHeight;
          balls.forEach(ball => {
            ball.x *= scaleX;
            ball.y *= scaleY;
          });
        }
        if (oldWidth && oldHeight && hero && gameMode === "globe") {
          hero.x *= width / oldWidth;
          hero.y *= height / oldHeight;
        }
        dropX = Math.max(40, Math.min(width - 40, dropX * (width / oldWidth)));
      }

      function setMessage(text) {
        messageElement.textContent = text;
      }

      function updateInfo() {
        if (gameMode === "globe") {
          gameTitleElement.textContent = "转动地球找黑珠";
          boxLabelElement.textContent = "旋 转 地 球";
          goalEmojiElement.textContent = "🌍";
          goalLabelElement.textContent = "找到黑珠";
          goalCountElement.textContent = blackSpot.visible ? 1 : 0;
          goalTotalElement.textContent = "/1";
          queueCountElement.textContent = "—";
          ballCountElement.textContent = "隐藏";
          roundNumberElement.textContent = "地球";
          nextBallElement.hidden = true;
          nextNameElement.textContent = "用方向键转动地球";
          shakeButton.textContent = "💡 黑珠提示";
          return;
        }
        if (gameMode === "inside") {
          gameTitleElement.textContent = "黑珠里面的寻物冒险";
          boxLabelElement.textContent = "黑 珠 内 部";
          goalEmojiElement.textContent = "🔎";
          goalLabelElement.textContent = "找回物品";
          goalCountElement.textContent = foundCount;
          goalTotalElement.textContent = `/${lostItems.length}`;
          queueCountElement.textContent = "—";
          ballCountElement.textContent = lostItems.length - foundCount;
          roundNumberElement.textContent = "黑珠内";
          nextBallElement.hidden = true;
          nextNameElement.textContent = "方向键移动，空格跳跃";
          shakeButton.textContent = "✨ 提示位置";
          return;
        }
        const nextType = queue[0];
        gameTitleElement.textContent = "滚滚宝石合成";
        boxLabelElement.textContent = "滚 动 大 框";
        goalEmojiElement.textContent = "🏺";
        goalLabelElement.textContent = "宇宙变化";
        goalCountElement.textContent = balls.some(ball => ["bottle", "earth", "sun", "uranus", "solar", "black"].includes(ball.type)) ? 1 : 0;
        goalTotalElement.textContent = "/1";
        queueCountElement.textContent = queue.length;
        ballCountElement.textContent = balls.length;
        roundNumberElement.textContent = round;
        shakeButton.textContent = "↔ 晃一晃";
        nextBallElement.hidden = !nextType;
        nextNameElement.textContent = nextType ? TYPE_INFO[nextType].name : "全部落下了";
        if (nextType) nextBallElement.style.background = TYPE_INFO[nextType].color;
      }

      function makeBall(type, x, y, vx = 0, vy = 0) {
        return {
          id: ++idCounter,
          type,
          x,
          y,
          vx,
          vy,
          radius: TYPE_INFO[type].radius,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - .5) * .08,
          bornAt: performance.now()
        };
      }

      function dropBall() {
        if (!queue.length || won || gameMode !== "merge") return;
        const type = queue.shift();
        balls.push(makeBall(type, dropX, 82, (Math.random() - .5) * 1.2, 0));
        setMessage(`${TYPE_INFO[type].name}落下来了，左右晃一晃让相同的碰到！`);
        updateInfo();
        canvas.focus();
      }

      function moveDrop(amount) {
        dropX = Math.max(42, Math.min(width - 42, dropX + amount));
        horizontalPush = Math.max(-.24, Math.min(.24, horizontalPush + amount * .003));
      }

      function shake(direction = 1) {
        balls.forEach((ball, index) => {
          ball.vx += direction * (2.6 + (index % 3) * .35);
          ball.vy -= .8 + Math.random() * 1.4;
        });
        horizontalPush = direction * .18;
        setMessage("框子晃起来啦，珠子和宝石正在滚动！");
      }

      function mergeBalls(first, second) {
        const nextType = first.type === "ice" ? (round === 1 ? "bomb" : "bottle") : TYPE_INFO[first.type].next;
        if (!nextType) return null;
        const merged = makeBall(
          nextType,
          (first.x + second.x) / 2,
          (first.y + second.y) / 2,
          (first.vx + second.vx) / 2,
          -3.7
        );
        mergeFlash.push({ x: merged.x, y: merged.y, life: 1, color: TYPE_INFO[nextType].color });
        if (nextType === "bomb") setMessage("两颗冰宝石变成炸弹啦，快捂住耳朵！");
        else if (nextType === "bottle") setMessage("第二遍完成！两颗冰宝石变成了纪念瓷瓶！");
        else setMessage(`叮！两颗${TYPE_INFO[first.type].name}变成了${TYPE_INFO[nextType].name}！`);
        return merged;
      }

      function canMerge(type) {
        return Boolean(TYPE_INFO[type].next || type === "ice");
      }

      function solveCollisions() {
        const removed = new Set();
        const additions = [];

        for (let firstIndex = 0; firstIndex < balls.length; firstIndex += 1) {
          const first = balls[firstIndex];
          if (removed.has(first.id)) continue;
          for (let secondIndex = firstIndex + 1; secondIndex < balls.length; secondIndex += 1) {
            const second = balls[secondIndex];
            if (removed.has(second.id)) continue;
            const dx = second.x - first.x;
            const dy = second.y - first.y;
            const minDistance = first.radius + second.radius;
            const distanceSquared = dx * dx + dy * dy;
            if (distanceSquared >= minDistance * minDistance) continue;

            const distance = Math.max(.01, Math.sqrt(distanceSquared));
            if (first.type === second.type && canMerge(first.type) && performance.now() - first.bornAt > 180 && performance.now() - second.bornAt > 180) {
              removed.add(first.id);
              removed.add(second.id);
              additions.push(mergeBalls(first, second));
              break;
            }

            const nx = dx / distance;
            const ny = dy / distance;
            const overlap = minDistance - distance;
            first.x -= nx * overlap * .5;
            first.y -= ny * overlap * .5;
            second.x += nx * overlap * .5;
            second.y += ny * overlap * .5;
            const relativeVelocity = (second.vx - first.vx) * nx + (second.vy - first.vy) * ny;
            if (relativeVelocity < 0) {
              const impulse = -relativeVelocity * .72;
              first.vx -= impulse * nx;
              first.vy -= impulse * ny;
              second.vx += impulse * nx;
              second.vy += impulse * ny;
            }
          }
        }

        if (removed.size) {
          balls = balls.filter(ball => !removed.has(ball.id));
          balls.push(...additions.filter(Boolean));
          updateInfo();
        }
      }

      function makeExplosion(x, y) {
        const colors = ["#368cf4", "#45bc78", "#ef5b63", "#f3b936", "#ffffff"];
        for (let index = 0; index < 44; index += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.5 + Math.random() * 6;
          sparks.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: .8 + Math.random() * .8,
            color: colors[index % colors.length]
          });
        }
      }

      function splitBall(ball, newType, spread = 28) {
        balls = balls.filter(item => item.id !== ball.id);
        balls.push(
          makeBall(newType, ball.x - spread, ball.y, -2.3, -4.8),
          makeBall(newType, ball.x + spread, ball.y, 2.3, -4.8)
        );
        mergeFlash.push({ x: ball.x, y: ball.y, life: 1.8, color: TYPE_INFO[newType].color });
        updateInfo();
      }

      function startGlobeGame() {
        gameMode = "globe";
        queue = [];
        balls = [];
        sparks = [];
        mergeFlash = [];
        hero = null;
        lostItems = [];
        globeAngle = 0;
        globeTilt = 0;
        blackSpot = { x: 0, y: 0, visible: false, radius: 18 };
        foundCount = 0;
        setMessage("丢失的物品藏起来了！用四个方向键转动地球，找到黑色珠子后点它。 ");
        updateInfo();
      }

      function updateGlobe(step) {
        const turnSpeed = .025 * step;
        if (pressedKeys.has("ArrowLeft")) globeAngle -= turnSpeed;
        if (pressedKeys.has("ArrowRight")) globeAngle += turnSpeed;
        if (pressedKeys.has("ArrowUp")) globeTilt = Math.max(-.75, globeTilt - turnSpeed);
        if (pressedKeys.has("ArrowDown")) globeTilt = Math.min(.75, globeTilt + turnSpeed);
        updateInfo();
      }

      function createInsideWorld() {
        worldWidth = Math.max(2400, width * 3.2);
        const floorY = height - 64;
        platforms = [
          { x: 0, y: floorY, width: worldWidth, height: 44 },
          { x: 330, y: floorY - 105, width: 190, height: 18 },
          { x: 760, y: floorY - 145, width: 220, height: 18 },
          { x: 1210, y: floorY - 95, width: 180, height: 18 },
          { x: 1640, y: floorY - 150, width: 230, height: 18 },
          { x: 2050, y: floorY - 110, width: 190, height: 18 }
        ];
        const itemPlan = [
          ["blue", 260, floorY - 25],
          ["green", 430, floorY - 132],
          ["red", 690, floorY - 25],
          ["sapphire", 860, floorY - 173],
          ["ruby", 1120, floorY - 27],
          ["emerald", 1295, floorY - 123],
          ["ice", 1750, floorY - 180],
          ["bottle", 2180, floorY - 140]
        ];
        lostItems = itemPlan.map(([type, x, y], index) => ({
          id: `lost-${index}`,
          type,
          x,
          y,
          radius: Math.min(23, TYPE_INFO[type].radius),
          angle: Math.random() * Math.PI * 2,
          found: false
        }));
      }

      function startInsideGame() {
        gameMode = "inside";
        createInsideWorld();
        const floorY = height - 64;
        hero = { x: 80, y: floorY - 28, vx: 0, vy: 0, radius: 22, onGround: true, facing: 1 };
        cameraX = 0;
        foundCount = 0;
        hintGlow = 1.5;
        pressedKeys.clear();
        setMessage("进入黑色珠子里面了！方向键控制方向，空格键跳跃，小人不会掉出世界。 ");
        updateInfo();
      }

      function updateInside(step) {
        if (!hero || won) return;
        const acceleration = .42 * step;
        if (pressedKeys.has("ArrowLeft")) {
          hero.vx -= acceleration;
          hero.facing = -1;
        }
        if (pressedKeys.has("ArrowRight")) {
          hero.vx += acceleration;
          hero.facing = 1;
        }
        hero.vx *= Math.pow(.84, step);
        hero.vx = Math.max(-5.2, Math.min(5.2, hero.vx));
        hero.vy += .46 * step;
        const previousBottom = hero.y + hero.radius;
        hero.x += hero.vx * step;
        hero.y += hero.vy * step;
        hero.onGround = false;

        platforms.forEach(platform => {
          const within = hero.x + hero.radius > platform.x && hero.x - hero.radius < platform.x + platform.width;
          const crossedTop = previousBottom <= platform.y + 4 && hero.y + hero.radius >= platform.y;
          if (within && crossedTop && hero.vy >= 0) {
            hero.y = platform.y - hero.radius;
            hero.vy = 0;
            hero.onGround = true;
          }
        });

        hero.x = Math.max(hero.radius, Math.min(worldWidth - hero.radius, hero.x));
        if (hero.y > height - hero.radius - 10) {
          hero.y = height - 64 - hero.radius;
          hero.vy = 0;
          hero.onGround = true;
        }
        cameraX += ((hero.x - width * .38) - cameraX) * Math.min(1, .09 * step);
        cameraX = Math.max(0, Math.min(worldWidth - width, cameraX));
        hintGlow = Math.max(0, hintGlow - .01 * step);

        lostItems.forEach(item => {
          if (item.found) return;
          if (Math.hypot(item.x - hero.x, item.y - hero.y) < hero.radius + item.radius + 8) {
            item.found = true;
            foundCount += 1;
            mergeFlash.push({ x: item.x - cameraX, y: item.y, life: 1.4, color: TYPE_INFO[item.type].color });
            setMessage(`找到了${TYPE_INFO[item.type].name}！还差 ${lostItems.length - foundCount} 件。`);
            updateInfo();
          }
        });

        if (foundCount === lostItems.length && !won) {
          won = true;
          setMessage("黑色珠子里的丢失物品全部找回来啦！");
          window.setTimeout(() => { winElement.hidden = false; }, 650);
        }
      }

      function handleSpecialStages() {
        if (won || gameMode !== "merge") return;
        const bomb = balls.find(ball => ball.type === "bomb");
        if (bomb && performance.now() - bomb.bornAt > 950) {
          makeExplosion(bomb.x, bomb.y);
          mergeFlash.push({ x: bomb.x, y: bomb.y, life: 2.2, color: "#f3b936" });
          balls = [];
          queue = shuffledQueue();
          round = 2;
          dropX = width / 2;
          horizontalPush = 0;
          setMessage("砰！炸弹爆出了第二遍的 60 颗珠子，继续用下方向键放下！");
          updateInfo();
          return;
        }

        const bottle = balls.find(ball => ball.type === "bottle");
        if (bottle && performance.now() - bottle.bornAt > 800) {
          splitBall(bottle, "earth", 30);
          setMessage("纪念瓷瓶分裂成了两个会滚动的地球！");
          return;
        }

        const sun = balls.find(ball => ball.type === "sun");
        if (sun && performance.now() - sun.bornAt > 950) {
          splitBall(sun, "uranus", 32);
          setMessage("太阳分裂成了两个天王星！");
          return;
        }

        const solar = balls.find(ball => ball.type === "solar");
        if (solar && performance.now() - solar.bornAt > 950) {
          balls = balls.filter(ball => ball.id !== solar.id);
          balls.push(makeBall("black", solar.x, solar.y, 0, -2.5));
          queue = [];
          mergeFlash.push({ x: solar.x, y: solar.y, life: 2, color: "#7656d9" });
          setMessage("太阳系爆出了一颗黑色珠子，它开始吸走所有东西！");
          updateInfo();
          return;
        }

        const black = balls.find(ball => ball.type === "black");
        if (black) {
          const others = balls.filter(ball => ball.id !== black.id);
          others.forEach(ball => {
            const dx = black.x - ball.x;
            const dy = black.y - ball.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            ball.vx += dx / distance * .2;
            ball.vy += dy / distance * .2;
          });
          const swallowed = new Set(others.filter(ball => Math.hypot(ball.x - black.x, ball.y - black.y) < black.radius + 9).map(ball => ball.id));
          if (swallowed.size) {
            balls = balls.filter(ball => !swallowed.has(ball.id));
            black.radius = Math.min(54, black.radius + swallowed.size * 2);
          }
          const blackAge = performance.now() - black.bornAt;
          if ((balls.length === 1 && blackAge > 900) || blackAge > 4200) {
            startGlobeGame();
          }
        }
      }

      function updatePhysics(step) {
        if (gameMode === "globe") {
          updateGlobe(step);
          return;
        }
        if (gameMode === "inside") {
          updateInside(step);
          mergeFlash.forEach(flash => { flash.life -= .035 * step; });
          mergeFlash = mergeFlash.filter(flash => flash.life > 0);
          return;
        }
        const wall = 15;
        horizontalPush *= .972;
        balls.forEach(ball => {
          ball.vx += horizontalPush * step;
          ball.vy += .28 * step;
          ball.vx *= Math.pow(.995, step);
          ball.vy *= Math.pow(.999, step);
          ball.x += ball.vx * step;
          ball.y += ball.vy * step;
          ball.angle += (ball.vx / Math.max(10, ball.radius)) * .06 * step + ball.spin;

          if (ball.x - ball.radius < wall) {
            ball.x = wall + ball.radius;
            ball.vx = Math.abs(ball.vx) * .68;
          } else if (ball.x + ball.radius > width - wall) {
            ball.x = width - wall - ball.radius;
            ball.vx = -Math.abs(ball.vx) * .68;
          }

          if (ball.y + ball.radius > height - wall) {
            ball.y = height - wall - ball.radius;
            ball.vy = -Math.abs(ball.vy) * .48;
            if (Math.abs(ball.vy) < .42) ball.vy = 0;
            ball.vx *= .975;
          }
          if (ball.y - ball.radius < 68) {
            ball.y = 68 + ball.radius;
            ball.vy = Math.abs(ball.vy) * .5;
          }
        });

        solveCollisions();
        mergeFlash.forEach(flash => { flash.life -= .035 * step; });
        mergeFlash = mergeFlash.filter(flash => flash.life > 0);
        sparks.forEach(spark => {
          spark.vy += .12 * step;
          spark.x += spark.vx * step;
          spark.y += spark.vy * step;
          spark.life -= .022 * step;
        });
        sparks = sparks.filter(spark => spark.life > 0);
        handleSpecialStages();
      }

      function roundedPolygonPath(radius, sides = 8) {
        context.beginPath();
        for (let index = 0; index < sides; index += 1) {
          const angle = (Math.PI * 2 * index) / sides - Math.PI / 2;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          if (index === 0) context.moveTo(x, y);
          else context.lineTo(x, y);
        }
        context.closePath();
      }

      function drawBall(ball) {
        const info = TYPE_INFO[ball.type];
        context.save();
        context.translate(ball.x, ball.y);
        context.rotate(ball.angle);
        context.shadowColor = "rgba(22, 62, 88, .28)";
        context.shadowBlur = 7;
        context.shadowOffsetY = 5;

        if (ball.type === "bomb") {
          context.fillStyle = "#202b36";
          context.strokeStyle = "rgba(255,255,255,.85)";
          context.lineWidth = 3;
          context.beginPath();
          context.arc(0, 0, ball.radius, 0, Math.PI * 2);
          context.fill();
          context.stroke();
          context.shadowColor = "transparent";
          context.strokeStyle = "#f3b936";
          context.lineWidth = 5;
          context.beginPath();
          context.moveTo(18, -26);
          context.quadraticCurveTo(29, -42, 35, -27);
          context.stroke();
          context.fillStyle = "#ff7b39";
          context.beginPath();
          context.arc(35, -28, 6, 0, Math.PI * 2);
          context.fill();
          context.restore();
          return;
        }

        if (ball.type === "bottle") {
          context.fillStyle = "#f5fdff";
          context.strokeStyle = "#3d8fc6";
          context.lineWidth = 3;
          context.beginPath();
          context.moveTo(-10, -ball.radius);
          context.lineTo(10, -ball.radius);
          context.lineTo(11, -21);
          context.bezierCurveTo(25, -13, 27, 4, 23, 22);
          context.quadraticCurveTo(0, 32, -23, 22);
          context.bezierCurveTo(-27, 4, -25, -13, -11, -21);
          context.closePath();
          context.fill();
          context.stroke();
          context.shadowColor = "transparent";
          context.strokeStyle = "#71b8df";
          context.lineWidth = 2;
          context.beginPath();
          context.moveTo(-18, 8);
          context.quadraticCurveTo(0, -3, 18, 8);
          context.stroke();
          context.fillStyle = "#ef5b63";
          context.beginPath();
          context.arc(0, 13, 8, 0, Math.PI * 2);
          context.fill();
          context.restore();
          return;
        }

        if (ball.type === "earth") {
          const ocean = context.createRadialGradient(-12, -14, 2, 0, 0, ball.radius * 1.15);
          ocean.addColorStop(0, "#a2ecff");
          ocean.addColorStop(.3, "#2e91dd");
          ocean.addColorStop(1, "#13539c");
          context.fillStyle = ocean;
          context.strokeStyle = "rgba(255,255,255,.85)";
          context.lineWidth = 3;
          context.beginPath();
          context.arc(0, 0, ball.radius, 0, Math.PI * 2);
          context.fill();
          context.stroke();
          context.shadowColor = "transparent";
          context.fillStyle = "#50bd70";
          context.beginPath();
          context.ellipse(-10, -5, 13, 19, -.55, 0, Math.PI * 2);
          context.ellipse(15, 13, 12, 8, .4, 0, Math.PI * 2);
          context.fill();
          context.restore();
          return;
        }

        if (ball.type === "sun") {
          context.shadowColor = "#f8b42c";
          context.shadowBlur = 18;
          context.strokeStyle = "#f8b42c";
          context.lineWidth = 5;
          for (let index = 0; index < 12; index += 1) {
            const angle = index * Math.PI / 6;
            context.beginPath();
            context.moveTo(Math.cos(angle) * 43, Math.sin(angle) * 43);
            context.lineTo(Math.cos(angle) * 52, Math.sin(angle) * 52);
            context.stroke();
          }
          const sunGlow = context.createRadialGradient(-10, -12, 2, 0, 0, ball.radius);
          sunGlow.addColorStop(0, "#fff9bd");
          sunGlow.addColorStop(.55, "#ffd34f");
          sunGlow.addColorStop(1, "#ed7625");
          context.fillStyle = sunGlow;
          context.beginPath();
          context.arc(0, 0, ball.radius, 0, Math.PI * 2);
          context.fill();
          context.restore();
          return;
        }

        if (ball.type === "uranus") {
          context.shadowColor = "transparent";
          context.strokeStyle = "rgba(75,139,169,.7)";
          context.lineWidth = 6;
          context.beginPath();
          context.ellipse(0, 0, ball.radius + 12, 12, -.35, 0, Math.PI * 2);
          context.stroke();
          const planet = context.createRadialGradient(-10, -12, 2, 0, 0, ball.radius);
          planet.addColorStop(0, "#e4ffff");
          planet.addColorStop(.4, "#7ce0e4");
          planet.addColorStop(1, "#328ca7");
          context.fillStyle = planet;
          context.beginPath();
          context.arc(0, 0, ball.radius, 0, Math.PI * 2);
          context.fill();
          context.strokeStyle = "rgba(255,255,255,.8)";
          context.lineWidth = 3;
          context.stroke();
          context.restore();
          return;
        }

        if (ball.type === "solar") {
          context.shadowColor = "#7186e8";
          context.shadowBlur = 16;
          context.fillStyle = "#17234d";
          context.beginPath();
          context.arc(0, 0, ball.radius, 0, Math.PI * 2);
          context.fill();
          context.shadowColor = "transparent";
          context.strokeStyle = "#8ea7ff";
          context.lineWidth = 2;
          [15, 25, 35].forEach(radius => {
            context.beginPath();
            context.ellipse(0, 0, radius, radius * .42, -.35, 0, Math.PI * 2);
            context.stroke();
          });
          context.fillStyle = "#ffd44d";
          context.beginPath();
          context.arc(0, 0, 7, 0, Math.PI * 2);
          context.fill();
          context.fillStyle = "#76dff5";
          context.beginPath();
          context.arc(24, -8, 4, 0, Math.PI * 2);
          context.fill();
          context.restore();
          return;
        }

        if (ball.type === "black") {
          context.shadowColor = "#7656d9";
          context.shadowBlur = 22;
          const darkness = context.createRadialGradient(-8, -10, 1, 0, 0, ball.radius);
          darkness.addColorStop(0, "#4b4a64");
          darkness.addColorStop(.35, "#111521");
          darkness.addColorStop(1, "#000000");
          context.fillStyle = darkness;
          context.beginPath();
          context.arc(0, 0, ball.radius, 0, Math.PI * 2);
          context.fill();
          context.strokeStyle = "#8b6ee8";
          context.lineWidth = 3;
          context.stroke();
          context.restore();
          return;
        }

        const gradient = context.createRadialGradient(-ball.radius * .35, -ball.radius * .38, 2, 0, 0, ball.radius * 1.15);
        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(.2, info.color);
        gradient.addColorStop(1, info.gem ? "#073c5c" : "#173d58");
        context.fillStyle = gradient;
        context.strokeStyle = "rgba(255,255,255,.8)";
        context.lineWidth = 3;

        if (info.gem) roundedPolygonPath(ball.radius, 8);
        else context.beginPath(), context.arc(0, 0, ball.radius, 0, Math.PI * 2);
        context.fill();
        context.stroke();

        context.shadowColor = "transparent";
        context.fillStyle = "rgba(255,255,255,.52)";
        context.beginPath();
        context.ellipse(-ball.radius * .3, -ball.radius * .36, ball.radius * .23, ball.radius * .12, -.55, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawPreview(now) {
        if (!queue.length) return;
        const info = TYPE_INFO[queue[0]];
        const pulse = 1 + Math.sin(now / 180) * .05;
        context.save();
        context.globalAlpha = .82;
        context.setLineDash([5, 7]);
        context.strokeStyle = "rgba(45, 104, 135, .42)";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(dropX, 64);
        context.lineTo(dropX, 126);
        context.stroke();
        context.setLineDash([]);
        context.translate(dropX, 82);
        context.scale(pulse, pulse);
        context.fillStyle = info.color;
        context.beginPath();
        context.arc(0, 0, 21, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = "#fff";
        context.lineWidth = 3;
        context.stroke();
        context.restore();
      }

      function drawHero(now) {
        if (!hero) return;
        const bob = Math.sin(now / 150) * 2;
        context.save();
        context.translate(hero.x, hero.y + bob);
        context.strokeStyle = "#173451";
        context.lineWidth = 5;
        context.lineCap = "round";
        context.beginPath();
        context.moveTo(-8, 17);
        context.lineTo(-13, 32);
        context.moveTo(8, 17);
        context.lineTo(13, 32);
        context.moveTo(-14, 3);
        context.lineTo(-25, 13);
        context.moveTo(14, 3);
        context.lineTo(25, 13);
        context.stroke();
        context.fillStyle = "#ffd45e";
        context.beginPath();
        context.roundRect(-16, -2, 32, 25, 9);
        context.fill();
        context.fillStyle = "#080b12";
        context.beginPath();
        context.arc(0, 10, 6, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "#ffd5b4";
        context.beginPath();
        context.arc(0, -17, 17, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "#29394d";
        context.beginPath();
        context.arc(0, -22, 17, Math.PI, Math.PI * 2);
        context.fill();
        context.fillStyle = "#173451";
        context.beginPath();
        context.arc(-6, -16, 2, 0, Math.PI * 2);
        context.arc(6, -16, 2, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawGlobeScene(now) {
        const space = context.createRadialGradient(width / 2, height / 2, 30, width / 2, height / 2, Math.max(width, height));
        space.addColorStop(0, "#243c79");
        space.addColorStop(1, "#070b24");
        context.fillStyle = space;
        context.fillRect(0, 0, width, height);
        context.fillStyle = "rgba(255,255,255,.78)";
        for (let index = 0; index < 48; index += 1) {
          const x = (index * 97 + 27) % width;
          const y = 70 + ((index * 53) % Math.max(120, height - 100));
          context.beginPath();
          context.arc(x, y, 1 + index % 3, 0, Math.PI * 2);
          context.fill();
        }

        const centerX = width / 2;
        const centerY = height / 2 + 28;
        const radius = Math.min(width * .34, height * .34, 220);
        context.save();
        context.shadowColor = "#62c8ff";
        context.shadowBlur = 28;
        const ocean = context.createRadialGradient(centerX - radius * .35, centerY - radius * .4, 8, centerX, centerY, radius);
        ocean.addColorStop(0, "#a8efff");
        ocean.addColorStop(.28, "#3b9ee3");
        ocean.addColorStop(1, "#123a86");
        context.fillStyle = ocean;
        context.beginPath();
        context.arc(centerX, centerY, radius, 0, Math.PI * 2);
        context.fill();
        context.clip();
        context.shadowColor = "transparent";

        for (let index = -2; index <= 2; index += 1) {
          const longitude = globeAngle + index * 1.35;
          const landX = centerX + Math.sin(longitude) * radius * .72;
          const visibleScale = .3 + Math.max(0, Math.cos(longitude)) * .7;
          context.fillStyle = index % 2 ? "#55bb69" : "#70ca6e";
          context.beginPath();
          context.ellipse(landX, centerY + Math.sin(index * 2.1 + globeTilt) * radius * .36, radius * .25 * visibleScale, radius * .32, longitude * .18, 0, Math.PI * 2);
          context.fill();
        }

        context.strokeStyle = "rgba(220,250,255,.2)";
        context.lineWidth = 2;
        for (let index = -2; index <= 2; index += 1) {
          context.beginPath();
          context.ellipse(centerX, centerY + index * radius * .22, radius * Math.sqrt(Math.max(.1, 1 - index * index * .04)), radius * .11, 0, 0, Math.PI * 2);
          context.stroke();
        }
        context.restore();

        const markerLongitude = 2.45;
        const markerLatitude = -.18;
        const relative = globeAngle + markerLongitude;
        const depth = Math.cos(relative) * Math.cos(markerLatitude);
        blackSpot.visible = depth > .08;
        blackSpot.x = centerX + Math.sin(relative) * radius * .83 * Math.cos(markerLatitude);
        blackSpot.y = centerY + Math.sin(markerLatitude + globeTilt) * radius * .72;
        blackSpot.radius = 17 + Math.max(0, depth) * 8;
        if (blackSpot.visible) {
          context.save();
          context.shadowColor = hintGlow > 0 ? "#fff19a" : "#8b6ee8";
          context.shadowBlur = hintGlow > 0 ? 25 : 14;
          context.fillStyle = "#05070c";
          context.beginPath();
          context.arc(blackSpot.x, blackSpot.y, blackSpot.radius, 0, Math.PI * 2);
          context.fill();
          context.strokeStyle = "#9b80f0";
          context.lineWidth = 3;
          context.stroke();
          context.restore();
        }

        context.fillStyle = "rgba(255,255,255,.92)";
        context.font = "800 16px -apple-system, BlinkMacSystemFont, sans-serif";
        context.textAlign = "center";
        context.fillText("用方向键转动地球，找到后点击黑色珠子", centerX, 92);
        hintGlow = Math.max(0, hintGlow - .01);
      }

      function drawInsideScene(now) {
        const cave = context.createLinearGradient(0, 0, 0, height);
        cave.addColorStop(0, "#17152d");
        cave.addColorStop(.65, "#30264a");
        cave.addColorStop(1, "#17121f");
        context.fillStyle = cave;
        context.fillRect(0, 0, width, height);
        context.fillStyle = "rgba(137,111,205,.18)";
        for (let index = 0; index < 30; index += 1) {
          const x = ((index * 137 - cameraX * .25) % (width + 100)) - 50;
          const y = 85 + (index * 83) % Math.max(160, height - 160);
          context.beginPath();
          context.arc(x, y, 8 + index % 5, 0, Math.PI * 2);
          context.fill();
        }

        context.save();
        context.translate(-cameraX, 0);
        platforms.forEach((platform, index) => {
          const platformGradient = context.createLinearGradient(0, platform.y, 0, platform.y + platform.height);
          platformGradient.addColorStop(0, index === 0 ? "#8770b6" : "#9a83c8");
          platformGradient.addColorStop(1, "#40355e");
          context.fillStyle = platformGradient;
          context.fillRect(platform.x, platform.y, platform.width, platform.height);
          context.fillStyle = "rgba(210,195,255,.35)";
          context.fillRect(platform.x, platform.y, platform.width, 4);
        });
        lostItems.forEach(item => {
          if (item.found) return;
          if (hintGlow > 0) {
            context.save();
            context.globalAlpha = .35 + Math.sin(now / 100) * .18;
            context.strokeStyle = "#fff5a3";
            context.lineWidth = 5;
            context.beginPath();
            context.arc(item.x, item.y, item.radius + 12, 0, Math.PI * 2);
            context.stroke();
            context.restore();
          }
          drawBall(item);
        });
        drawHero(now);
        context.restore();

        context.fillStyle = "rgba(255,255,255,.9)";
        context.font = "800 15px -apple-system, BlinkMacSystemFont, sans-serif";
        context.textAlign = "left";
        context.fillText(`探索距离 ${Math.round(hero ? hero.x : 0)} / ${Math.round(worldWidth)}`, 20, 92);
      }

      function draw(now) {
        context.clearRect(0, 0, width, height);

        if (gameMode === "globe") {
          drawGlobeScene(now);
        } else if (gameMode === "inside") {
          drawInsideScene(now);
        } else {

          const background = context.createLinearGradient(0, 0, 0, height);
          background.addColorStop(0, "#eefbff");
          background.addColorStop(1, "#c7e8f4");
          context.fillStyle = background;
          context.fillRect(0, 0, width, height);

          context.fillStyle = "rgba(72, 135, 164, .12)";
          for (let x = 38; x < width; x += 54) {
            context.beginPath();
            context.arc(x, height - 28, 3, 0, Math.PI * 2);
            context.fill();
          }

          drawPreview(now);
          balls.forEach(drawBall);
        }

        mergeFlash.forEach(flash => {
          const radius = (1.8 - Math.min(1.8, flash.life)) * 55 + 18;
          context.save();
          context.globalAlpha = Math.min(1, flash.life);
          context.strokeStyle = flash.color;
          context.lineWidth = 5;
          context.beginPath();
          context.arc(flash.x, flash.y, radius, 0, Math.PI * 2);
          context.stroke();
          context.restore();
        });

        sparks.forEach(spark => {
          context.save();
          context.globalAlpha = Math.max(0, spark.life);
          context.fillStyle = spark.color;
          context.beginPath();
          context.arc(spark.x, spark.y, 4.5, 0, Math.PI * 2);
          context.fill();
          context.restore();
        });
      }

      function frame(now) {
        const delta = lastTime ? Math.min(34, now - lastTime) : 16;
        lastTime = now;
        const step = delta / 16.67;
        updatePhysics(step);

        draw(now);
        requestAnimationFrame(frame);
      }

      function restart() {
        queue = shuffledQueue();
        balls = [];
        dropX = width / 2;
        horizontalPush = 0;
        won = false;
        round = 1;
        mergeFlash = [];
        sparks = [];
        gameMode = "merge";
        hero = null;
        lostItems = [];
        foundCount = 0;
        hintGlow = 0;
        globeAngle = 0;
        globeTilt = 0;
        blackSpot = { x: 0, y: 0, visible: false, radius: 18 };
        cameraX = 0;
        platforms = [];
        pressedKeys.clear();
        winElement.hidden = true;
        setMessage("按左右方向键调位置，按下方向键放下珠子！");
        updateInfo();
        canvas.focus();
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return Math.max(42, Math.min(width - 42, event.clientX - rect.left));
      }

      canvas.addEventListener("pointermove", event => {
        if (gameMode === "merge") dropX = pointerPosition(event);
      });

      canvas.addEventListener("pointerdown", event => {
        if (gameMode === "globe") {
          const rect = canvas.getBoundingClientRect();
          const pointerX = event.clientX - rect.left;
          const pointerY = event.clientY - rect.top;
          if (blackSpot.visible && Math.hypot(pointerX - blackSpot.x, pointerY - blackSpot.y) <= blackSpot.radius + 14) {
            startInsideGame();
          } else {
            setMessage("这里没有黑色珠子，再用方向键转一转地球吧！");
          }
        } else if (gameMode === "merge") {
          dropX = pointerPosition(event);
          dropBall();
        }
      });

      document.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(event.key)) event.preventDefault();
        if (gameMode === "globe") {
          if (event.key.startsWith("Arrow")) pressedKeys.add(event.key);
          return;
        }
        if (gameMode === "inside") {
          if (event.key.startsWith("Arrow")) pressedKeys.add(event.key);
          if (event.key === " " && hero && hero.onGround && !event.repeat) {
            hero.vy = -9.2;
            hero.onGround = false;
            setMessage("跳起来啦！继续寻找丢失的物品。 ");
          }
          return;
        }
        if (event.key === "ArrowLeft") moveDrop(-24);
        if (event.key === "ArrowRight") moveDrop(24);
        if (event.key === "ArrowDown") dropBall();
        if (event.key === "ArrowUp") shake(Math.random() > .5 ? 1 : -1);
      });

      document.addEventListener("keyup", event => {
        pressedKeys.delete(event.key);
      });

      shakeButton.addEventListener("click", () => {
        if (gameMode === "globe") {
          hintGlow = 2.5;
          setMessage("提示：发光的黑色珠子藏在地球背面，继续左右转动！");
        } else if (gameMode === "inside") {
          hintGlow = 2;
          setMessage("丢失的物品亮起来啦，快去找它们！");
        } else {
          shake(Math.random() > .5 ? 1 : -1);
        }
      });
      document.querySelector("#restartButton").addEventListener("click", restart);
      document.querySelector("#againButton").addEventListener("click", restart);
      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      restart();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
