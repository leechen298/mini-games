<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>滚滚宝石合成</title>
    <style>
      :root {
        color-scheme: light;
        --sky: #eaf8ff;
        --panel: rgba(255, 255, 255, 0.92);
        --ink: #173451;
        --muted: #60758a;
        --line: #c8dfec;
        --blue: #368cf4;
        --green: #45bc78;
        --red: #ef5b63;
        --sapphire: #205dda;
        --ruby: #d92755;
        --emerald: #07986a;
        --gold: #f3b936;
        --shadow: rgba(37, 86, 118, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          radial-gradient(circle at 12% 10%, rgba(255,255,255,.95) 0 5%, transparent 18%),
          radial-gradient(circle at 88% 18%, #d5f3ff 0 8%, transparent 24%),
          linear-gradient(180deg, var(--sky), #f9fcff 70%, #e4f7ea);
      }

      button { font: inherit; }

      .app {
        width: min(1180px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 14px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 4vw, 40px);
        line-height: 1.08;
      }

      .goal {
        min-width: 138px;
        padding: 9px 13px;
        border: 2px solid #78d4ad;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 8px 20px var(--shadow);
        text-align: center;
        font-weight: 900;
        white-space: nowrap;
      }

      .layout {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 12px;
      }

      .game-card,
      .side {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 18px 45px var(--shadow);
      }

      .game-card {
        min-width: 0;
        padding: 14px;
        display: grid;
        grid-template-rows: auto auto;
        align-content: start;
        gap: 10px;
      }

      .box-wrap {
        position: relative;
        min-height: 0;
      }

      canvas {
        width: 100%;
        height: min(70vh, 680px);
        min-height: 500px;
        display: block;
        border: 10px solid #70a8c3;
        border-top-color: #9bcbe0;
        border-radius: 26px;
        background: #d9f1fa;
        box-shadow:
          inset 0 0 0 3px rgba(255,255,255,.75),
          inset 0 -18px 28px rgba(54, 121, 151, .15),
          0 8px 18px rgba(47, 99, 126, .16);
        outline: none;
        touch-action: none;
      }

      canvas:focus-visible { border-color: var(--gold); }

      .box-label {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 10px;
        transform: translateX(-50%);
        padding: 5px 18px 7px;
        border-radius: 0 0 14px 14px;
        background: #70a8c3;
        color: #fff;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: .12em;
        pointer-events: none;
      }

      .message {
        min-height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 9px 14px;
        border-radius: 15px;
        background: #edf8e9;
        color: #32643d;
        font-weight: 850;
        text-align: center;
      }

      .side {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .side h2 { margin: 0 0 8px; font-size: 19px; }
      .side p { margin: 0; color: var(--muted); line-height: 1.55; font-weight: 700; }

      .next-card {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 12px;
        min-height: 76px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #f6fbfe;
      }

      .next-ball {
        width: 52px;
        height: 52px;
        border: 3px solid rgba(255,255,255,.8);
        border-radius: 50%;
        background: var(--blue);
        box-shadow: inset -9px -10px 12px rgba(0,0,0,.17), 0 5px 8px rgba(30,75,105,.2);
      }

      .next-card span { display: block; color: var(--muted); font-size: 12px; font-weight: 800; }
      .next-card strong { display: block; margin-top: 3px; font-size: 21px; }

      .chain {
        display: grid;
        gap: 6px;
      }

      .chain-step {
        display: grid;
        grid-template-columns: 34px 1fr 34px;
        align-items: center;
        min-height: 42px;
        padding: 5px 9px;
        border-radius: 12px;
        background: #f2f8fb;
        font-size: 13px;
        font-weight: 850;
      }

      .token {
        justify-self: center;
        width: 25px;
        height: 25px;
        border-radius: 50%;
        box-shadow: inset -4px -5px 6px rgba(0,0,0,.18);
      }

      .token.blue { background: var(--blue); }
      .token.green { background: var(--green); }
      .token.red { background: var(--red); }
      .token.gem { border-radius: 5px 50% 50%; transform: rotate(45deg); }
      .token.sapphire { background: linear-gradient(135deg, #70d2ff, var(--sapphire) 62%); }
      .token.ruby { background: linear-gradient(135deg, #ff7590, var(--ruby) 62%); }
      .token.emerald { background: linear-gradient(135deg, #6ff1bd, var(--emerald) 62%); }
      .token.ice { background: linear-gradient(135deg, #f5ffff, #76dff5 55%, #268fc9); }
      .token.bomb { border: 3px solid #4a5664; background: radial-gradient(circle at 35% 28%, #718092, #19222c 68%); }
      .token.bottle {
        border: 2px solid #3d8fc6;
        border-radius: 7px 7px 12px 12px;
        background: radial-gradient(circle at 50% 65%, #ef5b63 0 18%, transparent 20%), #f4fdff;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .stat {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        font-weight: 800;
      }

      .stat strong { display: block; margin-top: 3px; color: var(--ink); font-size: 21px; }

      .actions {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .action {
        min-height: 46px;
        border: 0;
        border-radius: 14px;
        background: #e5f0f6;
        color: var(--ink);
        font-weight: 900;
        cursor: pointer;
      }

      .action.primary { background: var(--emerald); color: #fff; }

      .win {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(15, 42, 70, .45);
        backdrop-filter: blur(5px);
      }

      .win[hidden] { display: none; }

      .win-card {
        width: min(430px, 100%);
        padding: 28px;
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 24px 80px rgba(15,42,70,.35);
        text-align: center;
      }

      .big-gem { font-size: 78px; filter: drop-shadow(0 9px 8px rgba(0,135,92,.28)); }
      .win-card h2 { margin: 4px 0 8px; font-size: 30px; }
      .win-card p { margin: 0 0 18px; color: var(--muted); line-height: 1.55; font-weight: 750; }

      @media (max-width: 800px) {
        .app { padding: 9px; }
        .layout { grid-template-columns: 1fr; }
        .game-card { padding: 8px; }
        canvas { height: 61vh; min-height: 470px; border-width: 7px; }
        .side { padding: 13px; }
        .chain { grid-template-columns: 1fr; }
        .topbar { align-items: flex-start; }
        .goal { min-width: 120px; padding-inline: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>滚滚宝石合成</h1>
        <div class="goal">🏺 纪念瓷瓶 <span id="bottleCount">0</span>/1</div>
      </header>

      <section class="layout">
        <article class="game-card">
          <div class="box-wrap">
            <div class="box-label">滚 动 大 框</div>
            <canvas id="gameCanvas" tabindex="0" aria-label="宝石滚动合成大框"></canvas>
          </div>
          <div id="message" class="message" aria-live="polite">按左右方向键调位置，按下方向键放下珠子！</div>
        </article>

        <aside class="side">
          <section>
            <h2>下一颗</h2>
            <div class="next-card">
              <i id="nextBall" class="next-ball"></i>
              <div><span>随机出现</span><strong id="nextName">蓝珠</strong></div>
            </div>
          </section>

          <section>
            <h2>合成顺序</h2>
            <div class="chain">
              <div class="chain-step"><i class="token blue"></i><span>两颗蓝珠</span><i class="token green"></i></div>
              <div class="chain-step"><i class="token green"></i><span>两颗绿珠</span><i class="token red"></i></div>
              <div class="chain-step"><i class="token red"></i><span>两颗红珠</span><i class="token gem sapphire"></i></div>
              <div class="chain-step"><i class="token gem sapphire"></i><span>两颗蓝宝石</span><i class="token gem ruby"></i></div>
              <div class="chain-step"><i class="token gem ruby"></i><span>两颗红宝石</span><i class="token gem emerald"></i></div>
              <div class="chain-step"><i class="token gem emerald"></i><span>两颗绿宝石</span><i class="token gem ice"></i></div>
              <div class="chain-step"><i class="token gem ice"></i><span>第一遍两颗冰宝石</span><i class="token bomb"></i></div>
              <div class="chain-step"><i class="token gem ice"></i><span>第二遍两颗冰宝石</span><i class="token bottle"></i></div>
            </div>
          </section>

          <section>
            <div class="stats">
              <div class="stat">第几遍<strong id="roundNumber">1</strong></div>
              <div class="stat">还没落下<strong id="queueCount">60</strong></div>
              <div class="stat">框内物品<strong id="ballCount">0</strong></div>
            </div>
          </section>

          <section>
            <h2>怎么玩</h2>
            <p>左右方向键移动落点，也会让框里的珠子滚动。准备好以后，按下方向键让珠子落下。没有倒计时，可以慢慢选择。鼠标和手指也能玩。</p>
          </section>

          <div class="actions">
            <button id="shakeButton" class="action" type="button">↔ 晃一晃</button>
            <button id="restartButton" class="action primary" type="button">重新开始</button>
          </div>
        </aside>
      </section>
    </main>

    <div id="win" class="win" hidden>
      <div class="win-card">
        <div class="big-gem">🏺</div>
        <h2>得到纪念瓷瓶啦！</h2>
        <p>你完成了两遍宝石合成，小瓷瓶里装着一颗特别的纪念珠！</p>
        <button id="againButton" class="action primary" type="button">再玩一次</button>
      </div>
    </div>

    <script>
      const TYPE_INFO = {
        blue: { name: "蓝珠", color: "#368cf4", next: "green", radius: 22, gem: false },
        green: { name: "绿珠", color: "#45bc78", next: "red", radius: 23, gem: false },
        red: { name: "红珠", color: "#ef5b63", next: "sapphire", radius: 24, gem: false },
        sapphire: { name: "蓝宝石", color: "#205dda", next: "ruby", radius: 26, gem: true },
        ruby: { name: "红宝石", color: "#d92755", next: "emerald", radius: 28, gem: true },
        emerald: { name: "绿宝石", color: "#07986a", next: "ice", radius: 30, gem: true },
        ice: { name: "冰宝石", color: "#76dff5", next: null, radius: 31, gem: true },
        bomb: { name: "炸弹", color: "#202b36", next: null, radius: 35, gem: false },
        bottle: { name: "纪念瓷瓶", color: "#eafaff", next: null, radius: 34, gem: false }
      };

      const START_TYPES = ["blue", "green", "red"];
      const canvas = document.querySelector("#gameCanvas");
      const context = canvas.getContext("2d");
      const messageElement = document.querySelector("#message");
      const nextBallElement = document.querySelector("#nextBall");
      const nextNameElement = document.querySelector("#nextName");
      const queueCountElement = document.querySelector("#queueCount");
      const ballCountElement = document.querySelector("#ballCount");
      const bottleCountElement = document.querySelector("#bottleCount");
      const roundNumberElement = document.querySelector("#roundNumber");
      const winElement = document.querySelector("#win");

      let width = 700;
      let height = 620;
      let queue = [];
      let balls = [];
      let dropX = width / 2;
      let lastTime = 0;
      let horizontalPush = 0;
      let won = false;
      let round = 1;
      let idCounter = 0;
      let mergeFlash = [];
      let sparks = [];

      function shuffledQueue() {
        const items = START_TYPES.flatMap(type => Array(20).fill(type));
        for (let index = items.length - 1; index > 0; index -= 1) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [items[index], items[randomIndex]] = [items[randomIndex], items[index]];
        }
        return items;
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const oldWidth = width;
        const oldHeight = height;
        width = Math.max(280, rect.width);
        height = Math.max(420, rect.height);
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        context.setTransform(ratio, 0, 0, ratio, 0, 0);

        if (oldWidth && oldHeight && balls.length) {
          const scaleX = width / oldWidth;
          const scaleY = height / oldHeight;
          balls.forEach(ball => {
            ball.x *= scaleX;
            ball.y *= scaleY;
          });
        }
        dropX = Math.max(40, Math.min(width - 40, dropX * (width / oldWidth)));
      }

      function setMessage(text) {
        messageElement.textContent = text;
      }

      function updateInfo() {
        const nextType = queue[0];
        queueCountElement.textContent = queue.length;
        ballCountElement.textContent = balls.length;
        bottleCountElement.textContent = balls.filter(ball => ball.type === "bottle").length;
        roundNumberElement.textContent = round;
        nextBallElement.hidden = !nextType;
        nextNameElement.textContent = nextType ? TYPE_INFO[nextType].name : "全部落下了";
        if (nextType) nextBallElement.style.background = TYPE_INFO[nextType].color;
      }

      function makeBall(type, x, y, vx = 0, vy = 0) {
        return {
          id: ++idCounter,
          type,
          x,
          y,
          vx,
          vy,
          radius: TYPE_INFO[type].radius,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - .5) * .08,
          bornAt: performance.now()
        };
      }

      function dropBall() {
        if (!queue.length || won) return;
        const type = queue.shift();
        balls.push(makeBall(type, dropX, 82, (Math.random() - .5) * 1.2, 0));
        setMessage(`${TYPE_INFO[type].name}落下来了，左右晃一晃让相同的碰到！`);
        updateInfo();
        canvas.focus();
      }

      function moveDrop(amount) {
        dropX = Math.max(42, Math.min(width - 42, dropX + amount));
        horizontalPush = Math.max(-.24, Math.min(.24, horizontalPush + amount * .003));
      }

      function shake(direction = 1) {
        balls.forEach((ball, index) => {
          ball.vx += direction * (2.6 + (index % 3) * .35);
          ball.vy -= .8 + Math.random() * 1.4;
        });
        horizontalPush = direction * .18;
        setMessage("框子晃起来啦，珠子和宝石正在滚动！");
      }

      function mergeBalls(first, second) {
        const nextType = first.type === "ice" ? (round === 1 ? "bomb" : "bottle") : TYPE_INFO[first.type].next;
        if (!nextType) return null;
        const merged = makeBall(
          nextType,
          (first.x + second.x) / 2,
          (first.y + second.y) / 2,
          (first.vx + second.vx) / 2,
          -3.7
        );
        mergeFlash.push({ x: merged.x, y: merged.y, life: 1, color: TYPE_INFO[nextType].color });
        if (nextType === "bomb") setMessage("两颗冰宝石变成炸弹啦，快捂住耳朵！");
        else if (nextType === "bottle") setMessage("第二遍完成！两颗冰宝石变成了纪念瓷瓶！");
        else setMessage(`叮！两颗${TYPE_INFO[first.type].name}变成了${TYPE_INFO[nextType].name}！`);
        return merged;
      }

      function canMerge(type) {
        return Boolean(TYPE_INFO[type].next || type === "ice");
      }

      function solveCollisions() {
        const removed = new Set();
        const additions = [];

        for (let firstIndex = 0; firstIndex < balls.length; firstIndex += 1) {
          const first = balls[firstIndex];
          if (removed.has(first.id)) continue;
          for (let secondIndex = firstIndex + 1; secondIndex < balls.length; secondIndex += 1) {
            const second = balls[secondIndex];
            if (removed.has(second.id)) continue;
            const dx = second.x - first.x;
            const dy = second.y - first.y;
            const minDistance = first.radius + second.radius;
            const distanceSquared = dx * dx + dy * dy;
            if (distanceSquared >= minDistance * minDistance) continue;

            const distance = Math.max(.01, Math.sqrt(distanceSquared));
            if (first.type === second.type && canMerge(first.type) && performance.now() - first.bornAt > 180 && performance.now() - second.bornAt > 180) {
              removed.add(first.id);
              removed.add(second.id);
              additions.push(mergeBalls(first, second));
              break;
            }

            const nx = dx / distance;
            const ny = dy / distance;
            const overlap = minDistance - distance;
            first.x -= nx * overlap * .5;
            first.y -= ny * overlap * .5;
            second.x += nx * overlap * .5;
            second.y += ny * overlap * .5;
            const relativeVelocity = (second.vx - first.vx) * nx + (second.vy - first.vy) * ny;
            if (relativeVelocity < 0) {
              const impulse = -relativeVelocity * .72;
              first.vx -= impulse * nx;
              first.vy -= impulse * ny;
              second.vx += impulse * nx;
              second.vy += impulse * ny;
            }
          }
        }

        if (removed.size) {
          balls = balls.filter(ball => !removed.has(ball.id));
          balls.push(...additions.filter(Boolean));
          updateInfo();
        }
      }

      function makeExplosion(x, y) {
        const colors = ["#368cf4", "#45bc78", "#ef5b63", "#f3b936", "#ffffff"];
        for (let index = 0; index < 44; index += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.5 + Math.random() * 6;
          sparks.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: .8 + Math.random() * .8,
            color: colors[index % colors.length]
          });
        }
      }

      function handleSpecialStages() {
        if (won) return;
        const bomb = balls.find(ball => ball.type === "bomb");
        if (bomb && performance.now() - bomb.bornAt > 950) {
          makeExplosion(bomb.x, bomb.y);
          mergeFlash.push({ x: bomb.x, y: bomb.y, life: 2.2, color: "#f3b936" });
          balls = [];
          queue = shuffledQueue();
          round = 2;
          dropX = width / 2;
          horizontalPush = 0;
          setMessage("砰！炸弹爆出了第二遍的 60 颗珠子，继续用下方向键放下！");
          updateInfo();
          return;
        }

        const bottle = balls.find(ball => ball.type === "bottle");
        if (bottle && performance.now() - bottle.bornAt > 800) {
          balls = [bottle];
          setMessage("纪念瓷瓶完成啦，里面装着一颗特别的纪念珠！");
          updateInfo();
          won = true;
          window.setTimeout(() => { winElement.hidden = false; }, 650);
        }
      }

      function updatePhysics(step) {
        const wall = 15;
        horizontalPush *= .972;
        balls.forEach(ball => {
          ball.vx += horizontalPush * step;
          ball.vy += .28 * step;
          ball.vx *= Math.pow(.995, step);
          ball.vy *= Math.pow(.999, step);
          ball.x += ball.vx * step;
          ball.y += ball.vy * step;
          ball.angle += (ball.vx / Math.max(10, ball.radius)) * .06 * step + ball.spin;

          if (ball.x - ball.radius < wall) {
            ball.x = wall + ball.radius;
            ball.vx = Math.abs(ball.vx) * .68;
          } else if (ball.x + ball.radius > width - wall) {
            ball.x = width - wall - ball.radius;
            ball.vx = -Math.abs(ball.vx) * .68;
          }

          if (ball.y + ball.radius > height - wall) {
            ball.y = height - wall - ball.radius;
            ball.vy = -Math.abs(ball.vy) * .48;
            if (Math.abs(ball.vy) < .42) ball.vy = 0;
            ball.vx *= .975;
          }
          if (ball.y - ball.radius < 68) {
            ball.y = 68 + ball.radius;
            ball.vy = Math.abs(ball.vy) * .5;
          }
        });

        solveCollisions();
        mergeFlash.forEach(flash => { flash.life -= .035 * step; });
        mergeFlash = mergeFlash.filter(flash => flash.life > 0);
        sparks.forEach(spark => {
          spark.vy += .12 * step;
          spark.x += spark.vx * step;
          spark.y += spark.vy * step;
          spark.life -= .022 * step;
        });
        sparks = sparks.filter(spark => spark.life > 0);
        handleSpecialStages();
      }

      function roundedPolygonPath(radius, sides = 8) {
        context.beginPath();
        for (let index = 0; index < sides; index += 1) {
          const angle = (Math.PI * 2 * index) / sides - Math.PI / 2;
          const x = Math.cos(angle) * radius;
          const y = Math.sin(angle) * radius;
          if (index === 0) context.moveTo(x, y);
          else context.lineTo(x, y);
        }
        context.closePath();
      }

      function drawBall(ball) {
        const info = TYPE_INFO[ball.type];
        context.save();
        context.translate(ball.x, ball.y);
        context.rotate(ball.angle);
        context.shadowColor = "rgba(22, 62, 88, .28)";
        context.shadowBlur = 7;
        context.shadowOffsetY = 5;

        if (ball.type === "bomb") {
          context.fillStyle = "#202b36";
          context.strokeStyle = "rgba(255,255,255,.85)";
          context.lineWidth = 3;
          context.beginPath();
          context.arc(0, 0, ball.radius, 0, Math.PI * 2);
          context.fill();
          context.stroke();
          context.shadowColor = "transparent";
          context.strokeStyle = "#f3b936";
          context.lineWidth = 5;
          context.beginPath();
          context.moveTo(18, -26);
          context.quadraticCurveTo(29, -42, 35, -27);
          context.stroke();
          context.fillStyle = "#ff7b39";
          context.beginPath();
          context.arc(35, -28, 6, 0, Math.PI * 2);
          context.fill();
          context.restore();
          return;
        }

        if (ball.type === "bottle") {
          context.fillStyle = "#f5fdff";
          context.strokeStyle = "#3d8fc6";
          context.lineWidth = 3;
          context.beginPath();
          context.moveTo(-10, -ball.radius);
          context.lineTo(10, -ball.radius);
          context.lineTo(11, -21);
          context.bezierCurveTo(25, -13, 27, 4, 23, 22);
          context.quadraticCurveTo(0, 32, -23, 22);
          context.bezierCurveTo(-27, 4, -25, -13, -11, -21);
          context.closePath();
          context.fill();
          context.stroke();
          context.shadowColor = "transparent";
          context.strokeStyle = "#71b8df";
          context.lineWidth = 2;
          context.beginPath();
          context.moveTo(-18, 8);
          context.quadraticCurveTo(0, -3, 18, 8);
          context.stroke();
          context.fillStyle = "#ef5b63";
          context.beginPath();
          context.arc(0, 13, 8, 0, Math.PI * 2);
          context.fill();
          context.restore();
          return;
        }

        const gradient = context.createRadialGradient(-ball.radius * .35, -ball.radius * .38, 2, 0, 0, ball.radius * 1.15);
        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(.2, info.color);
        gradient.addColorStop(1, info.gem ? "#073c5c" : "#173d58");
        context.fillStyle = gradient;
        context.strokeStyle = "rgba(255,255,255,.8)";
        context.lineWidth = 3;

        if (info.gem) roundedPolygonPath(ball.radius, 8);
        else context.beginPath(), context.arc(0, 0, ball.radius, 0, Math.PI * 2);
        context.fill();
        context.stroke();

        context.shadowColor = "transparent";
        context.fillStyle = "rgba(255,255,255,.52)";
        context.beginPath();
        context.ellipse(-ball.radius * .3, -ball.radius * .36, ball.radius * .23, ball.radius * .12, -.55, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawPreview(now) {
        if (!queue.length) return;
        const info = TYPE_INFO[queue[0]];
        const pulse = 1 + Math.sin(now / 180) * .05;
        context.save();
        context.globalAlpha = .82;
        context.setLineDash([5, 7]);
        context.strokeStyle = "rgba(45, 104, 135, .42)";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(dropX, 64);
        context.lineTo(dropX, 126);
        context.stroke();
        context.setLineDash([]);
        context.translate(dropX, 82);
        context.scale(pulse, pulse);
        context.fillStyle = info.color;
        context.beginPath();
        context.arc(0, 0, 21, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = "#fff";
        context.lineWidth = 3;
        context.stroke();
        context.restore();
      }

      function draw(now) {
        context.clearRect(0, 0, width, height);

        const background = context.createLinearGradient(0, 0, 0, height);
        background.addColorStop(0, "#eefbff");
        background.addColorStop(1, "#c7e8f4");
        context.fillStyle = background;
        context.fillRect(0, 0, width, height);

        context.fillStyle = "rgba(72, 135, 164, .12)";
        for (let x = 38; x < width; x += 54) {
          context.beginPath();
          context.arc(x, height - 28, 3, 0, Math.PI * 2);
          context.fill();
        }

        drawPreview(now);
        balls.forEach(drawBall);

        mergeFlash.forEach(flash => {
          const radius = (1.8 - Math.min(1.8, flash.life)) * 55 + 18;
          context.save();
          context.globalAlpha = Math.min(1, flash.life);
          context.strokeStyle = flash.color;
          context.lineWidth = 5;
          context.beginPath();
          context.arc(flash.x, flash.y, radius, 0, Math.PI * 2);
          context.stroke();
          context.restore();
        });

        sparks.forEach(spark => {
          context.save();
          context.globalAlpha = Math.max(0, spark.life);
          context.fillStyle = spark.color;
          context.beginPath();
          context.arc(spark.x, spark.y, 4.5, 0, Math.PI * 2);
          context.fill();
          context.restore();
        });
      }

      function frame(now) {
        const delta = lastTime ? Math.min(34, now - lastTime) : 16;
        lastTime = now;
        const step = delta / 16.67;
        updatePhysics(step);

        draw(now);
        requestAnimationFrame(frame);
      }

      function restart() {
        queue = shuffledQueue();
        balls = [];
        dropX = width / 2;
        horizontalPush = 0;
        won = false;
        round = 1;
        mergeFlash = [];
        sparks = [];
        winElement.hidden = true;
        setMessage("按左右方向键调位置，按下方向键放下珠子！");
        updateInfo();
        canvas.focus();
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return Math.max(42, Math.min(width - 42, event.clientX - rect.left));
      }

      canvas.addEventListener("pointermove", event => {
        dropX = pointerPosition(event);
      });

      canvas.addEventListener("pointerdown", event => {
        dropX = pointerPosition(event);
        dropBall();
      });

      document.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowRight", "ArrowDown"].includes(event.key)) event.preventDefault();
        if (event.key === "ArrowLeft") moveDrop(-24);
        if (event.key === "ArrowRight") moveDrop(24);
        if (event.key === "ArrowDown") dropBall();
        if (event.key === "ArrowUp") shake(Math.random() > .5 ? 1 : -1);
      });

      document.querySelector("#shakeButton").addEventListener("click", () => shake(Math.random() > .5 ? 1 : -1));
      document.querySelector("#restartButton").addEventListener("click", restart);
      document.querySelector("#againButton").addEventListener("click", restart);
      window.addEventListener("resize", resizeCanvas);

      resizeCanvas();
      restart();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
